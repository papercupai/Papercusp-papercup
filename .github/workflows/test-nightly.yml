name: Test (nightly full)
on:
  schedule:
    - cron: '0 7 * * *'  # 07:00 UTC
  workflow_dispatch:

jobs:
  full:
    name: Full test suite
    runs-on: ubuntu-latest
    timeout-minutes: 60
    services:
      # Dev-box-parity PG (WI-123): ~30 "unit"-tier suites transitively open a
      # pool against the default localhost:5432/papercusp (connection.ts
      # resolution chain) — they pass on any box with a provisioned native
      # :5432 and ECONNREFUSE here without one. pgvector image because the
      # baseline schema has vector(N) columns (same image as the
      # testcontainers integration tier).
      # WI-2942 (2026-07-05): pg16 -> pg18 to match the shipped/embedded operator
      # (PostgreSQL 18.3) — see libs/test-config/src/pg-container.ts.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          # Private Papercusp/* submodules need a credential to clone — same
          # SUBMODULES_PAT convention as test.yml; without it this job dies at
          # checkout and the nightly runs zero tests.
          token: ${{ secrets.SUBMODULES_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: |
          npm install --global "$(node -p "require('./package.json').packageManager")"
          npm ci --legacy-peer-deps

      - name: Doctor (Docker + node)
        run: node scripts/test-doctor.mjs

      # Bring the PG service to schema head with the real boot-path migration
      # runner (roles + extensions + 000-baseline + sql/*.sql) so suites that
      # transitively resolve the default :5432/papercusp URL find the same
      # environment the dev box / green-checkpoint tree provide. ~4s.
      - name: Provision papercusp PG (dev-box parity)
        env:
          CI_PG_SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: node scripts/ci-provision-pg.mjs

      - name: Cache testcontainers Docker layer
        uses: actions/cache@v4
        with:
          path: ~/.testcontainers
          key: testcontainers-${{ runner.os }}-postgres-16-alpine

      - name: Run every workspace's tests (unit + integration)
        env:
          CI: 'true'
        run: node scripts/affected-tests.mjs --all --integration

      # (The "slow tier" step — orchestrator main-loop — was removed 2026-06-11:
      # the legacy run-loop and its main-loop.test.ts were retired to
      # libs/papercusp/_retired/orchestrator-run-loop, which left the tier
      # permanently empty and exiting 1 (WI-123 round 4).)

      - name: Run benchmarks (libs/generic/papergrid)
        if: always()
        continue-on-error: true
        env:
          CI: 'true'
        run: npm run bench --workspace @papercusp/grid-core

      - name: Upload bench results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bench-results
          path: |
            libs/**/bench-result.json
            libs/**/bench-output.txt
          if-no-files-found: ignore

      - name: Publish JUnit reports
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: vitest-nightly
          path: '**/junit.xml'
          reporter: java-junit
          fail-on-error: false

      # (The "Upload coverage artifacts (if produced)" step was removed
      # 2026-09-02 — P-007, design-to-code-coverage-seam-2026-09-02. It could
      # never fire: the test step above is `affected-tests.mjs --all
      # --integration`, and that runner has no Vitest-flag passthrough and
      # hard-rejects unrecognized flags, so no workspace has ever run with
      # `--coverage` and no ./coverage dir has ever existed in CI. With
      # `if-no-files-found: ignore` the step uploaded nothing, silently, every
      # night. Worse, it made the arrangement look wired from both ends: the
      # provider config in libs/test-config/src/vitest-config.ts cited "the
      # nightly job" as its consumer while this step implied that config as its
      # producer, so each artifact corroborated the other and the missing link
      # in the middle stayed invisible. Re-adding an upload step is only honest
      # alongside a real producer (a passthrough in affected-tests.mjs) and a
      # merge step; lib/doc-claims/coverage-wiring.test.ts fails if an upload
      # step comes back without one.)

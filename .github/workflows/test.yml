name: Test
on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  # EI-18661485259809120: every commit git-sync ever produces (and therefore every
  # commit `main` ever advances to, since main only fast-forwards from a staging
  # commit — never a fresh commit of its own) carries a literal `[skip ci]` suffix
  # (run-git-sync.ts's default message). GitHub Actions honors `[skip ci]` in the
  # HEAD commit message for BOTH `push` and `pull_request` events, so the two
  # triggers above have never actually fired on a real `main` advance since the
  # staging->main model landed — the "GATING" lints below have been gating nothing.
  # `workflow_dispatch` is a distinct trigger type that is NOT filtered by a commit's
  # `[skip ci]` marker, so green-checkpoint's push() (apps/operator/lib/release/
  # green-checkpoint.ts) explicitly fires this via the GitHub API right after each
  # FF of `main` — restoring a real, working remote gate on every promotion.
  workflow_dispatch:
    inputs:
      # WI-7013: green-checkpoint's dispatchCiWorkflow (apps/operator/lib/release/
      # green-checkpoint.ts) passes the sha `main` advanced FROM as this input —
      # the real diff base for a promotion dispatched at ref=main. Without it,
      # AFFECTED_BASE below falls back to origin/main, which on a workflow_dispatch
      # run checked out AT main IS the same commit as HEAD: an empty diff, so the
      # affected-test step reports `tasks=0 status=passed` having verified nothing
      # (green by vacuity). Optional — a caller with no prior sha (dispatchCiWorkflow
      # omits it) or a human manually dispatching this workflow both leave it unset,
      # and the fallback below is unchanged.
      base:
        description: 'Base sha to diff against (green-checkpoint passes the pre-FF main sha; leave blank to diff against origin/main)'
        required: false
        type: string

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  affected:
    name: Affected tests
    runs-on: ubuntu-latest
    # WI-7151: this used to be 15, which guarantees the "Run affected unit +
    # integration suites" step is killed by job timeout on nearly every run that
    # touches operator-core (~682 *.integration.test.ts files; the dev-box
    # green-checkpoint's UNIT-ONLY equivalent — no --integration — already
    # measures ~55min locally per the root CLAUDE.md, and CI's 2-core hosted
    # runners are typically slower than a dev box for CPU-bound work, plus
    # --integration adds real testcontainers overhead on top). Every run in the
    # job's history is `cancelled`/`failure` at ~10-20min — this suite has
    # LITERALLY NEVER completed in CI, so there is no real-run duration to read
    # yet (see the step reorder below for the OTHER half of this fix: the ~50
    # gating lints were being silently skipped by the same timeout because they
    # ran AFTER this step, not just cancelled with it).
    # 180 is a deliberately conservative, bounded estimate (well under GH's
    # 360min hosted-runner ceiling) chosen to give the suite room to actually
    # finish at least once — NOT a measured number. Once a run completes,
    # tighten this to (measured duration + ~25% headroom) using the real
    # wall-clock time from that run instead of carrying this guess forward.
    timeout-minutes: 180
    services:
      # Dev-box-parity PG (WI-123): ~30 "unit"-tier suites transitively open a
      # pool against the default localhost:5432/papercusp (connection.ts
      # resolution chain) — they pass on any box with a provisioned native
      # :5432 and ECONNREFUSE here without one. pgvector image because the
      # baseline schema has vector(N) columns (same image as the
      # testcontainers integration tier).
      # WI-2942 (2026-07-05): pg16 -> pg18 to match the shipped/embedded operator
      # (PostgreSQL 18.3) — see libs/test-config/src/pg-container.ts.
      postgres:
        image: pgvector/pgvector:pg18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          # Private Papercusp/* submodules need a credential to clone. Add a repo
          # secret SUBMODULES_PAT (classic PAT with repo:read on the org, or a
          # fine-grained PAT scoped to the submodule repos) — or switch to SSH
          # deploy keys. Without it, `submodules: recursive` fails at checkout and
          # the whole suite never runs (this was the root cause of CI being red).
          token: ${{ secrets.SUBMODULES_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: |
          npm install --global "$(node -p "require('./package.json').packageManager")"
          npm ci --legacy-peer-deps

      # ⚠ EVERY step below carries `if: ${{ !cancelled() }}` ON PURPOSE — do not strip it
      # when adding a step, and DO add it to any step you add (WI-7006).
      #
      # Without it, GitHub skips every later step once one fails, and a SKIPPED gating
      # lint is indistinguishable from a PASSING one: the job just shows "failure" and a
      # reader attributes it to whatever failed first. That is not hypothetical. Between
      # ~2026-07-28 and 2026-08-02 this workflow failed at step 6 — `Doctor`, on a
      # DOC-STALENESS check — and GitHub silently skipped the affected-test suite and all
      # ~50 gating lints below. 0 green runs in 100, a week of zero remote coverage, and
      # an open item filed against a "CI red" for a lint CI had never actually evaluated.
      #
      # The three steps ABOVE deliberately have no `if:`: checkout / setup-node / install
      # are genuine prerequisites, and a failure there makes everything after it garbage.
      # Everything from here down is independent, so it reports its own verdict. A step
      # whose input a failed earlier step should have produced (tests vs the PG provision)
      # now fails LOUDLY instead of vanishing — that is the intended trade.
      - name: Doctor (Docker + node)
        if: ${{ !cancelled() }}
        run: node scripts/test-doctor.mjs

      # Bring the PG service to schema head with the real boot-path migration
      # runner (roles + extensions + 000-baseline + sql/*.sql) so suites that
      # transitively resolve the default :5432/papercusp URL find the same
      # environment the dev box / green-checkpoint tree provide. ~4s.
      - name: Provision papercusp PG (dev-box parity)
        if: ${{ !cancelled() }}
        env:
          CI_PG_SUPERUSER_URL: postgresql://postgres:postgres@localhost:5432/postgres
        run: node scripts/ci-provision-pg.mjs

      # EI-26479731794435031: affected-test selection is change-triggered, so a
      # promotion can skip migration drift even after PG provisioning succeeds.
      # Run the focused operator-core integration against that provisioned DB on
      # every promotion, with both the live DB and canonical tree explicit.
      - name: Migration drift integration gate
        if: ${{ !cancelled() }}
        env:
          HARNESS_ADMIN_DATABASE_URL: postgresql://harness_admin:harness_admin_pwd@localhost:5432/papercusp
          PAPERCUSP_TEST_PG_ADMIN_URL: postgresql://postgres:postgres@localhost:5432/postgres
          PAPERCUSP_SKIP_PG_DISCOVERY: '1'
          PAPERCUSP_INTEGRATION_ROOT: ${{ github.workspace }}
          PAPERCUSP_CANONICAL_TREE: ${{ github.workspace }}
        run: npm --workspace @papercusp/operator-core run test:integration:migration-drift

      # Plan-doc lint — fast read-only check against apps/operator/docs/plans/.
      # Fails the build on any error; warnings (e.g. missing ## Now)
      # surface in logs but don't gate. Legacy plans (no frontmatter)
      # are exempt by lintPlan itself. Spec: /internal/docs/spec/plan-format.
      - name: Lint plans
        if: ${{ !cancelled() }}
        working-directory: apps/operator
        run: npm run lint:plans

      # Plans are PG-canonical (plans-pg-canonical-migration-2026-06-03): fail on any
      # filesystem read of plan markdown outside source.ts / the backfill script.
      - name: Lint plans PG-canonical (no FS reads of plan markdown)
        if: ${{ !cancelled() }}
        working-directory: apps/operator
        run: npm run lint:plans-pg

      # Four-framework guard (admin-testing-tab-restructure P-038): fails on a new
      # .mjs under __tests__/integration/, a *-smoke.ts under scripts/, OR a
      # canonical test that matches no registry glob (invisible in the /adv tab).
      - name: Lint tests (four-framework + tab-coverage guard)
        if: ${{ !cancelled() }}
        working-directory: apps/operator
        run: npm run lint:tests

      # The /adv Tests-tab contract (.papercusp/testing-domains.json) is GENERATED
      # from testing-domains-registry.ts. Fail if it drifted (edit the registry,
      # then `npm run gen:contract`).
      - name: Check testing-domains contract is in sync
        if: ${{ !cancelled() }}
        run: npm run gen:contract:check

      # AGENT-ENV.md is GENERATED from the real repo config (workspaces, the
      # operator-vite alias, the test tooling) so the operating contract can't drift
      # out of sync the way a hand-written note does (EI-10941). Pure fs/config reads,
      # no PG → GATING. Regenerate with `npm run gen:agent-env`; `npm run doctor`
      # asserts the same invariants as runnable checks.
      - name: Check AGENT-ENV contract is in sync
        if: ${{ !cancelled() }}
        run: npm run gen:agent-env:check

      # BORROWABLE.md is GENERATED from scripts/gen-borrowable-catalog.mjs (the
      # curated libs/generic membership + .gitmodules). Fail if it drifted — every
      # code-derived surface is CI-gated so it can't go stale
      # (docs-and-memory-as-projections-2026-06-05 D-002).
      - name: Check BORROWABLE catalog is in sync
        if: ${{ !cancelled() }}
        run: npm run gen:borrowable:check

      # The CLAUDE.md bash→tool routing table is GENERATED from the audited
      # substitution pairs — the SAME artifact that seeds the registry both
      # PreToolUse hooks enforce (bash-to-tool-substitution-2026-07-26 P-019). The
      # point is prose that cannot drift from the gate: a table that advertises a
      # routing the hook does not apply (or omits one it does) teaches a false map
      # to every agent, since this file is spliced into every agent prompt. Pure
      # fs/module reads, no PG → GATING. Regenerate with `npm run gen:tool-routing`.
      - name: Check CLAUDE.md tool-routing table is in sync
        if: ${{ !cancelled() }}
        run: npm run gen:tool-routing:check

      # Starlight projection pages (starlight-projection-generators-2026-06-05, Brief 29)
      # are GENERATED from code/registry/PG into apps/operator-docs/.../reference/. The
      # LOW-CHURN two (blueprint catalog / role registry) are pure fs/code reads of
      # rarely-changing sources → GATING (fail on drift, like BORROWABLE).
      - name: Check generated reference pages are in sync (low-churn, gating)
        if: ${{ !cancelled() }}
        run: |
          npm run gen:doc-blueprint-catalog:check
          npm run gen:doc-role-registry:check

      # The insights index (the fleet adds insights continuously — measured stale
      # within ~25 min), the tool catalog (heavy full-registry import, fleet-fragile)
      # + the plans index (PG-dependent, churns constantly) are INFORMATIONAL — does
      # not gate (D-002, the docs-and-memory D-009 flap lesson). plans-index degrades
      # to a no-op with no DB. Surfaces drift in the CI log without blocking the merge.
      - name: Check generated reference pages (informational — does not gate)
        if: always()
        continue-on-error: true
        run: |
          npm run gen:doc-insights-index:check
          npm run gen:doc-tool-catalog:check
          npm run gen:doc-plans-index:check

      # Generic-first guard (generalize-libs-to-generic-2026-06-05 D-005): nudge a
      # zero-coupling, concept-naming algorithm file that landed in the app toward
      # libs/generic. Heuristic, so INFORMATIONAL — does not gate (like lint:knip).
      # Diff-scoped against origin/main; surfaces candidates in the CI log.
      - name: Generic-first lint (informational — does not gate)
        if: always()
        continue-on-error: true
        run: npm run lint:generic-first

      # Feature-gate guard (default-on-policy-enforcement 2026-06-16): a user-facing
      # feature toggle must be a FLAGS entry (default-on enforced + /admin/features-
      # flippable), NOT an ad-hoc process.env.PAPERCUSP_* boolean (which ships dark).
      # GATING (--strict): a NEW un-classified boolean env gate fails the build —
      # classify it as a FLAG, or add it to ALLOW in scripts/check-env-feature-gates.mjs.
      - name: Env feature-gate lint (gating)
        if: ${{ !cancelled() }}
        run: npm run lint:env-feature-gates:strict

      # Affected-set integrity guard: the gate must not silently run FEWER tests than
      # it appears to. `--ignore-submodules=all` used to suppress gitlink changes, so a
      # commit touching only a submodule (e.g. the memory lib) produced an empty affected
      # set and ZERO tests ran while the gate reported green. This must be a LINT, not a
      # vitest test: a test only runs when its workspace is affected, so the very bug it
      # guards would disarm it. GATING.
      - name: Lint affected-set gate integrity
        if: ${{ !cancelled() }}
        run: npm run lint:affected-gate

      # Workspace-deps-complete guard (EI-9831): a workspace that imports a local
      # @papercusp/* package without declaring it is invisible to the affected-set
      # reverse-dep walk (same failure class as lint:affected-gate's memory-only check
      # #4, generalized to every local package). GATING on a NEW undeclared edge; a
      # shrink-to-empty BASELINE grandfathers the 60 pre-existing edges found 2026-07-12.
      - name: Lint workspace deps complete
        if: ${{ !cancelled() }}
        run: npm run lint:workspace-deps-complete

      # Dependency license gate (open-source-release-2026-09-29 P-017, WI-10003906).
      # GATING. Reads every package-lock.json (all platforms' optional packages included)
      # and resolves every Cargo.lock with `cargo metadata --locked`; fails on any GPL /
      # AGPL / non-commercial / unknown license not reviewed in
      # scripts/license-exceptions.json. The ubuntu runner image ships cargo; with no local
      # crate cache the cargo leg falls back to a networked resolve. Exit 2 means part of
      # the graph was not measured — that is a failure here, never a pass.
      - name: Lint dependency licenses (npm + Rust)
        if: ${{ !cancelled() }}
        run: npm run lint:licenses

      # @restart retirement guard: the shared libs were renamed @restart/* ->
      # @papercusp/* (papercusp-systems-abstraction-2026-05-29). GATING — fails
      # the build with a "use @papercusp/<name>" message if any @restart/* import
      # or dep reappears, so a straggler never silently resolves.
      - name: Lint no-restart imports
        if: ${{ !cancelled() }}
        run: npm run lint:no-restart

      # no-raw-setInterval guard (schedule-inventory-and-ephemeral-tier-2026-06-26 P-007):
      # every operator-host recurring timer must go through managedSetInterval
      # (@papercusp/scheduled-registry) so it is NAMED + visible in schedule:inventory.
      # GATING on a NEW bare setInterval() outside the registry; a shrink-to-empty
      # BASELINE grandfathers the pre-codemod sites (emptied by the P-008 codemod).
      - name: Lint no raw setInterval
        if: ${{ !cancelled() }}
        run: npm run lint:no-raw-setinterval
      # documented-test-run-cwd guard (EI-21463787319820028): a header `Run:`
      # command whose --config/test paths resolve only from an UNSTATED package
      # cwd fails before any test runs, and the default-config retry times out —
      # both read as "this test is broken". GATING on the command being
      # executable AS WRITTEN from the repo root, or stating its cwd (`cd <pkg>
      # && …` / "(from <pkg>)") with every extension-bearing path existing under it.
      - name: Lint documented test run cwd
        if: ${{ !cancelled() }}
        run: npm run lint:documented-test-run-cwd

      # no-unenrolled-detached-import guard (WI-39811, follow-up to EI-20349773342925327):
      # a fire-and-forget `void import(...)` can still be walking its module graph after the
      # test file that started it finished. Vitest then throws EnvironmentTeardownError
      # mid-graph, and in the PURE lane (isolate:false, shared fork) the failure is charged to
      # whichever CO-RESIDENT file is collecting — victims report `(0 test)` and pass again in
      # a fresh process. Measured on the 2026-08-18 gate: 8 failed suites, rotating cast, none
      # of them the culprit. Enrolment is `trackDetached` (lib/detached-imports), which the
      # unit-layer setup drains before teardown. GATING, with an EMPTY baseline.
      # NOTE the failing scope is DERIVED from which workspaces set `laneSplit: true`, so a
      # workspace opting into the lane split later joins this guard automatically instead of
      # silently losing coverage; opting in WITHOUT wiring the drain is itself a failure.
      - name: Lint no unenrolled detached import
        if: ${{ !cancelled() }}
        run: npm run lint:no-unenrolled-detached-import

      # systemd StartLimit-placement guard (EI-19381535849234617): StartLimitIntervalSec
      # / StartLimitBurst are [Unit]-only directives. systemd parses one in [Service],
      # warns "Unknown key name ... ignoring", and silently falls back to the DEFAULT
      # 10s/5-burst rate limiter instead of whatever the unit intended — `systemd-analyze
      # --user verify` already surfaces the warning but exits 0, so it went unread for
      # weeks on 6 live units, including one whose own header promised "NEVER gives up"
      # via StartLimitIntervalSec=0, a promise that was not in effect. Scope: this covers
      # the version-controlled unit sources under apps/operator/scripts/systemd/ and
      # infra/phone-app/systemd/ — a host-local ~/.config/systemd/user/*.service.d/*.conf
      # drop-in is invisible to a repo lint by construction.
      - name: Lint systemd StartLimit placement
        if: ${{ !cancelled() }}
        run: npm run lint:systemd-startlimit-placement

      # no-proc-path-fixture guard (EI-19369372064589484): a made-up '/proc/…' path
      # literal HANGS Node's recursive mkdir forever (procfs answers ENOENT, node
      # reads that as "parent missing", creates /proc → EEXIST, retries, loops —
      # 44,995 syscalls in 3s). It wedges during vitest COLLECTION, so the run emits
      # zero output and is indistinguishable from a queued heavy job; it has cost the
      # fleet twice. Whether it hangs depends on which mkdir consumes the path
      # (coreutils fails in 5ms), which the author cannot see — so the idiom is
      # banned outright in favour of testing/unwritable-path.ts.
      - name: Lint no /proc path fixture
        if: ${{ !cancelled() }}
        run: npm run lint:no-proc-path-fixture

      # no-raw-blocks-edge guard (work-item-dependency-edges-2026-08-02 P-007 / D-013):
      # the DEPENDENCY-GRAPH analogue of the guard above. A feature→feature `blocks`
      # CYCLE permanently deadlocks the dispatch frontier — every feature in the cycle
      # is forever non-ready, because its blocker never terminates. The acyclicity
      # policy lives in ONE module (dbos/feature-blockers-edges.ts): syncFeatureBlockEdges
      # (the authoritative replace-semantics writer, which enforces it) or, for the link
      # tools' single raw edge, guardFeatureBlockEdgeAcyclic. The existing acyclicity
      # tests cover those functions' BEHAVIOUR but cannot observe a NEW call site that
      # never calls them — this closes that gap. BASELINE is EMPTY and must stay empty.
      - name: Lint no raw blocks edge
        if: ${{ !cancelled() }}
        run: npm run lint:no-raw-block-edge

      # no-raw-goal-holder-read guard (goal-live-holder-guarantee-2026-08-18 P-001 / D-003):
      # a goal's holder is an `agent_modes` row (mode='goal', subject=<goal id>) that
      # OUTLIVES the session that wrote it — nothing clears it on death, so counting rows
      # reports a goal nobody has touched in days as staffed. Measured: 4 of 6 active goals
      # dark 2-5 days while every surface called them held; the Blender's steward gone six
      # days with the row still naming it. The liveness fold lives in ONE module
      # (operator-core/lib/goals/holder.ts) and was never hard to write — it was easy to
      # FORGET, and forgetting it fails nothing. A behaviour test cannot observe a call site
      # that never calls it, which is the gap this closes. BASELINE is EMPTY and must stay so.
      - name: Lint no raw goal-holder read
        if: ${{ !cancelled() }}
        run: npm run lint:no-raw-goal-holder-read

      # no-unenrolled-detached-spawn guard (task-manager-no-escape-2026-07-27 P-016):
      # the PROCESS analogue of the setInterval guard above. A `detached: true` spawn
      # is a process meant to OUTLIVE the call that made it — the root of a subtree —
      # so it must be enrolled in the task ledger (task-manager/enroll-sync or
      # managed-spawn) or carry an explicit allowlist entry with a reason. Scoped to
      # detached spawns rather than all ~813 spawn sites on purpose: cgroup membership
      # is inherited, so confining ROOTS accounts for their descendants automatically.
      - name: Lint no unenrolled detached spawn
        if: ${{ !cancelled() }}
        run: npm run lint:no-unenrolled-spawn

      # no-unbounded-inbox-read guard (EI-19325897270823423): readInbox/readOutbox
      # fire on every agent turn, so an unbounded call site's cost multiplies with
      # fleet size — the class behind operator-hindsight.ts being measured as the
      # #1 per-agent-turn DB-load driver before it was converted to a targeted SQL
      # predicate (migration 736). GATING on a NEW call that supplies neither a
      # `since_ts` bound nor a `window`/`enough` stopping rule; BASELINE is EMPTY.
      - name: Lint no unbounded inbox read
        if: ${{ !cancelled() }}
        run: npm run lint:no-unbounded-inbox-read

      # no-raw-installSlug-filter guard (EI-19298972043721870): the READ-PATH analogue
      # of the two guards above. Pot-membership enforcement re-homes rows written under
      # a workspace-global label (hive-canary, @singleton, *, operator, all) to the
      # platform Pot, so a read filtering `harness_slug = ${installSlug}` verbatim can
      # match ZERO rows forever — with no error, which for a DETECTOR is
      # indistinguishable from "everything is healthy" (EI-19298246923137692 cost ~12
      # days of blind canary). GATING on NEW sites; a shrink-to-empty BASELINE
      # grandfathers the 18 pre-existing ones, which need a per-RELATION audit rather
      # than a blind sweep (not every raw filter is a bug — pot/install-scoped tables
      # are correctly read by the literal slug).
      - name: Lint no raw installSlug harness_slug filter
        if: ${{ !cancelled() }}
        run: npm run lint:no-raw-install-slug

      # no-raw-harness-sentinel guard (EI-20204314840596901): operator-scope
      # sessions carry ctx.harnessSlug='*'. A raw fallback, identity field, or
      # non-sentinel predicate can silently address the wrong harness bucket.
      - name: Lint no raw harness sentinel identity use
        if: ${{ !cancelled() }}
        run: npm run lint:no-raw-harness-sentinel

      # no-ungated-infinite-animation guard (hud-tab-public-release-2026-07-28 P-010 /
      # WI-6542): an `infinite` CSS animation on a selector that matches as soon as the
      # element renders keeps the whole 60fps repaint loop alive forever. Measured on the
      # Tauri webview (no GPU compositing): ~100% of a core idle vs ~18% with none — and
      # the cost is NOT per-animation, so ONE reintroduced always-on loop re-arms the full
      # tax for that screen while a partial fix measures identically to no fix. That is why
      # 107 of them accumulated unnoticed. GATING on a NEW always-on animation; a
      # shrink-only BASELINE grandfathers the sites still on latent surfaces.
      - name: Lint no ungated infinite animation
        if: ${{ !cancelled() }}
        run: npm run lint:no-ungated-infinite-animation

      # no-bespoke-state-read gate (unified-agent-state-plane-2026-07-27 P-005 / D-010,
      # named by D-016's enforcement-tier table):
      # a NEW bespoke state-read tool must declare, inside its defineTool literal,
      # either `@cell-lens <cell.id>` (it projects a registered cell) or a reasoned
      # `@not-a-cell <why>`. D-010 makes this a PRECONDITION of the cell registry
      # (P-003) shipping, not a follow-up: predicate_watches proved that a correct
      # substrate nobody adopts is surface #29, strictly worse than today.
      # GATING on a NEW undeclared state read; a shrink-only BASELINE grandfathers
      # the pre-existing ones (emptied by P-020, which retires them onto cells).
      - name: Lint no bespoke state read
        if: ${{ !cancelled() }}
        run: npm run lint:no-bespoke-state-read

      # declared-vs-consumed sweep (agent-state-plane-verification-2026-07-27 P-002,
      # generalising WI-6444): every optional CellSpec field and every column added by
      # migrations 689/694/697 must have BOTH a non-test writer and a non-test reader.
      # The defect class is a field that is declared, validated, documented and wired
      # at one end only — individually correct halves, so no unit test can see it.
      # The static twin of the P-001 producer census, and unlike that one it needs no
      # database, which is why it can gate here.
      # REPORTS (exit 0) for a gap with a filed `knownUnbuilt` ref; GATES on a new one.
      - name: Lint declared vs consumed
        if: ${{ !cancelled() }}
        run: npm run lint:declared-consumed

      # timer-classification guard (stop-discarded-dedup-and-audit-server-polling-
      # 2026-07-26 P-011): every managedSetInterval/PeriodicCheck registration must
      # declare a D-004 push-don't-poll classification (must-sample | timeout-reaper |
      # violation) so a new timer over derived state can't land unclassified.
      # GATING on a NEW unclassified call site; a shrink-to-empty BASELINE grandfathers
      # the pre-P-011 call sites.
      - name: Lint timer classification
        if: ${{ !cancelled() }}
        run: npm run lint:timer-classification

      # no-wire-compression guard (WI-5988, owner directive 2026-07-26):
      # Papercusp ships as a Tauri DESKTOP app — the operator host binds
      # 127.0.0.1 and every consumer is on the same machine, so compressing a
      # response spends CPU on both ends to shrink bytes that never leave the
      # box (gzipSync on large sync payloads blocked the event loop 50-100ms
      # per call). GATING on a compression PRODUCER in the transport layer;
      # decompression and at-rest/distribution compression (backups, zstd
      # archives, tarballs) are untouched.
      - name: Lint no wire compression
        if: ${{ !cancelled() }}
        run: npm run lint:no-wire-compression

      # eager promisify(execFile) guard (EI-10161): a module-scope `const x =
      # promisify(execFile)` throws at import time under a test's narrow
      # `vi.mock('node:child_process', () => ({ spawn }))` (execFile resolves to
      # undefined), crashing the WHOLE test file even when it never calls the
      # function — confirmed live via watchdog.ts's transitive import chain.
      # GATING on a NEW eager module-scope site; a shrink-to-empty BASELINE
      # grandfathers the pre-existing ~60 files pending a remediation pass.
      - name: Lint no eager execFile promisify
        if: ${{ !cancelled() }}
        run: npm run lint:no-eager-execfile-promisify

      # module-scope flags touch guard (WI-6650 / EI-18825928993608425): the same
      # class as the guard above, with @papercusp/flags in place of child_process. A
      # top-level `onFlagChange(...)` or eager `FLAG_DEFAULTS[...]` deref throws at
      # COLLECTION under a test's partial `vi.mock('@papercusp/flags[/server]')`,
      # failing the WHOLE file (0 tests run) and reding the gate — while naming the
      # MOCK, not the importer. Fired twice on coordination/log.ts (WI-6449, then
      # WI-6588 → 2 suites red) before that file was root-fixed. GATING on a NEW
      # site; a shrink-to-empty BASELINE grandfathers the 14 pre-existing ones.
      - name: Lint no module-scope flag subscribe
        if: ${{ !cancelled() }}
        run: npm run lint:no-module-scope-flag-subscribe

      # sql.json guard (EI-607): postgres-js sql.json(object) THROWS on the getOrgPg
      # client (a dual-package postgres-js module-instance mismatch in @papercusp/db)
      # — it silently broke the experiment ledger + EVERY replay-harness cell's
      # persistence, and integration tests are BLIND to it (tolerant root-postgres
      # client). GATING — bind jsonb as ${JSON.stringify(x)}::jsonb (server-side
      # cast → real jsonb object) instead. ALLOW-lists deliberate fresh-pool sites.
      - name: Lint no sql.json on getOrgPg client
        if: ${{ !cancelled() }}
        run: npm run lint:no-sql-json

      # SQL-comment backtick guard (EI-7661): a backtick inside a `--` SQL
      # comment silently ENDS the enclosing postgres-js sql`...` tagged
      # template early — the file still compiles (the trailing text can parse
      # as valid TS) and RUNS with the SQL query truncated mid-comment. This
      # amputated the entire WHERE clause from the mig-504 LWW guard's
      # engineer-issues + harness-features upserts on 2026-07-05, applying
      # stale writes unconditionally; only a regressed unit test caught it.
      # GATING — flags a `--` comment line with a raw (unescaped) backtick in
      # any file that uses a sql`...` tagged template.
      - name: Lint no backtick in SQL comment
        if: ${{ !cancelled() }}
        run: npm run lint:no-sql-comment-backtick

      # SQL-in-guidance guard (claimable-read-tool-and-sql-encapsulation-audit
      # -2026-07-21 P-006): the claimability drift that produced three different
      # answers to "what is claimable" (8 vs 2 vs 0) came back through GUIDANCE,
      # not code — a doc or a tool's own `guidance` told the next agent to
      # hand-write the query, and the hand-written version disagreed with what
      # the queue actually served. GATING — an agent-facing surface may not tell
      # an agent to SELECT from a table a dedicated tool already covers
      # (work_items, harness_plans, engineer_issues, work_items_claimable)
      # unless it states WHY at the site: `sql-snippet-justified: <reason>` on
      # the line or within 3 lines above. Implementation SQL inside a tool is
      # the encapsulation working and is never flagged.
      - name: Lint SQL-in-guidance is justified
        if: ${{ !cancelled() }}
        run: npm run lint:sql-guidance-justified

      # Raw control-byte guard (EI-7432): a NUL byte in tracked TypeScript made
      # ripgrep classify the file as binary and silently skip it, so searches
      # lied about code absence. GATING — scans tracked source files as Buffers
      # and rejects NUL plus C0 controls except tab/newline/carriage return.
      - name: Lint no raw control bytes
        if: ${{ !cancelled() }}
        run: npm run lint:no-control-bytes

      # Box-identity guard (WI-4419): the 0.0.8 cut shipped the owner's home path
      # 53,811 times inside sidecar/source.tar.zst — every release bundles a tar of
      # the working tree and hands it to whoever we give a build to. The release GATE
      # (papercusp-desktop/bin/audit-release-bundle.py) catches that, but only at CUT
      # time on the finished artifact — the most expensive moment to learn the fix is
      # a source change. GATING here, at EDIT time. It cannot know any box's name (and
      # must not, or it only works on one machine — the bug it prevents), so it detects
      # the CLASS: an absolute /home/<user>/ or /Users/<user>/ path in tracked source.
      # That is not merely a privacy rail — such a path is already broken on every
      # checkout but the author's. BASELINE IS EMPTY: fix the path, never add an
      # exception to make the build pass.
      - name: Lint no box identity in tracked source
        if: ${{ !cancelled() }}
        run: npm run lint:no-box-identity

      # Sibling rule, same WI-4419 family, different half of the class. The box-identity
      # lint hunts a home PATH and deliberately refuses to know your git name. This one
      # hunts the NAMED PROVENANCE TAG — `[owner:<name> <date>]` in a source comment —
      # which is how the owner's real name keeps reaching source.tar.zst. It has killed
      # two 0.0.9 cuts ~10 min in (the audit runs BEFORE the platform legs, so a whole
      # build dies for a one-word comment). It also catches what the cut's audit CANNOT:
      # that audit matches a short git name case-SENSITIVELY — rightly, since matching a
      # three-letter first name case-insensitively would hit a .avi extension and every
      # longer proper noun starting with it — so the lower-case spelling of the tag was
      # shipping silently. Anchoring on the `[owner:` tag is exact, so this rule is
      # case-insensitive with no false-positive surface.
      # BASELINE IS EMPTY: strip the name, never allowlist it.
      - name: Lint no named owner provenance tags in tracked source
        if: ${{ !cancelled() }}
        run: npm run lint:no-owner-name-tags

      # Third sibling, same WI-4419 family (WI-4776): the two rules above catch a
      # `[owner:<name>]` TAG and a `/home/<user>/` PATH — both structural shapes
      # that need no knowledge of whose box is running. This one catches what
      # neither can: a BARE mention of THIS box's own git name/email/hostname
      # with no tag and no path shape at all (e.g. a name dropped straight into a
      # comment). It can only ever find what THIS runner's own git identity is —
      # a no-op on a bare CI box is expected, not a bug (see the script header).
      # BASELINE IS EMPTY: remove the literal, never add an exception.
      - name: Lint no bare build-box identity literals in tracked source
        if: ${{ !cancelled() }}
        run: npm run lint:no-identity-literals

      # Committed conflict-marker guard (EI-1836): a COMMITTED git conflict bracket
      # (the live-merge resolver does NOT catch one already committed by a bad
      # git-sync auto-merge) broke `vite build` with a cryptic CssSyntaxError, which
      # froze the SPA build, the desktop sidecar, the WI-280 re-key witness, AND the
      # green-checkpoint — the whole fleet deploy, on a stray "Stashed" word in CSS.
      # GATING — flags any line starting with 7 of `<`/`>`/`|` (zero false positives;
      # brackets every git conflict) so it is a loud NAMED failure, not a downstream
      # cryptic build break.
      - name: Lint no committed conflict markers
        if: ${{ !cancelled() }}
        run: npm run lint:no-conflict-markers

      # Self-referential export-shim guard (EI-8850): a "forward-compat alias"
      # shim of the shape `export const X = X;` — written after X was already
      # renamed to the target name, colliding with its own export under the
      # SAME identifier — is always either a no-op or a duplicate-export build
      # break. esbuild fails loudly on `bundle-host.sh`, crash-looping the
      # shared staging bg-host (:3170) for the WHOLE fleet, and the failure
      # only surfaces at restart time. GATING — mechanical, zero-false-positive
      # pattern (a genuine rename alias always has two DIFFERENT identifiers).
      - name: Lint no self-referential export shims
        if: ${{ !cancelled() }}
        run: npm run lint:no-self-referential-export

      # Host-bundle build guard (P-009, 2026-07-12): bundle-host.sh runs at service
      # ExecStartPre + release deploy, NEVER in tests — so a change that breaks the
      # esbuild bundle is invisible to unit tests, tsc AND the green gate, and only
      # detonates at the next restart (:3170 down fleet-wide, deploy dead). It happened:
      # a dynamic import of @huggingface/transformers dragged onnxruntime-node's
      # per-platform `.node` addons into the graph → "No loader is configured for .node".
      # The three lints above each pattern-match ONE way to break this bundle; this is
      # the DIRECT detector — it runs the real bundle-host.sh (single source of truth for
      # the externals list) against a throwaway outfile. ~10s.
      - name: Lint host bundle builds
        if: ${{ !cancelled() }}
        run: npm run lint:host-bundle-builds

      # Client bundle-budget guard (EI-13213, 2026-07-19): apps/operator-vite
      # is a pure-browser SPA, but a `typeof window`-runtime-guarded dynamic
      # import can still be traced STATICALLY by Rolldown and drag a whole
      # server-only subtree (the whole agent-tools catalog, dbos/*, sync/hyperbee/*)
      # into the client build as dead weight invisible to unit tests. Runs the
      # real `vite build` into a throwaway outDir and asserts on what Rolldown
      # itself reports: zero INEFFECTIVE_DYNAMIC_IMPORT warnings, and the eager
      # (pre-first-paint) bundle stays under budget. ~15s.
      - name: Lint client bundle budget
        if: ${{ !cancelled() }}
        run: npm run lint:bundle-budget

      # CDN-egress guard (egress-monitor-origin-axis-2026-08-02 P-004): no NEW
      # foreign-origin asset URL may enter the shipped bundle. Third leg of that
      # plan's D-003 and the ONLY one that can see code nobody ran — the runtime
      # egress monitor is structurally blind to an unexercised path (Monaco
      # fetched 0.55.1 from jsdelivr for months because nobody opened the Gym
      # while a monitor was installed), and CSP prevents rather than observes.
      # Reads the built files in Node rather than shelling out to grep, which
      # classifies minified chunks as BINARY and silently reports nothing.
      # Baseline-ratcheted (scripts/no-cdn-egress-baseline.json, every row
      # carrying a reason + status); a hit is a DISCOVERY to establish liveness
      # for, never a verdict that egress occurred. Runs its own `vite build`
      # into a throwaway outDir, ~60s — deliberately NOT sharing the
      # bundle-budget build above, so neither gate's failure can mask the
      # other's.
      - name: Lint CDN egress
        if: ${{ !cancelled() }}
        run: npm run lint:no-cdn-egress

      # Smart-quote guard (EI-418, found via EI-412): a curly quote used as a
      # code delimiter (copy-paste through a smart-quoting surface) is a hard
      # esbuild/tsc parse failure that reads as mysterious. GATING — flags
      # U+2018/2019/201C/201D in code position (precise: leaves curly quotes in
      # strings/comments/JSX alone) so the whole file never silently fails to
      # transform.
      - name: Lint smart quotes in code
        if: ${{ !cancelled() }}
        run: npm run lint:smart-quotes

      # MDX compile guard (EI-438): a bare `<word>` placeholder in docs prose
      # (e.g. `<date>`, `<id>`) is parsed as an unclosed JSX tag and HARD-fails
      # `astro build`, blocking the whole apps/operator-docs build (every agent's
      # doc regen) — and git-sync auto-commits it before the break is visible.
      # GATING — compiles every tracked .mdx with the MDX core + remark-gfm
      # (matches starlight), so a non-compiling doc never reaches main.
      - name: Lint MDX compiles
        if: ${{ !cancelled() }}
        run: npm run lint:mdx

      # GitHub user-vs-org identity drift guard (WI-4978): `papercupai` is a
      # GitHub User (personal admin login), not an org — `Papercusp` is the real
      # org that owns the canonical repos. A doc that calls papercupai an "org"
      # is the exact confusion that shipped a broken first-party publish gate
      # (papercusp-registry's FIRST_PARTY_ORG hardcoded to the non-existent
      # 'papercupai' org, 404-ing for every publisher). GATING — regex scan of
      # tracked docs; the canonical explanation lives once in distribution.mdx.
      - name: Lint GitHub identity terminology
        if: ${{ !cancelled() }}
        run: npm run lint:github-identity-terms

      # Shell syntax guard (EI-13192): a concurrent shared-tree edit interleave
      # corrupted a .sh script (duplicated lines / a truncated assignment) and
      # git-sync auto-committed it before anyone ran `bash -n` by hand to notice.
      # GATING — a real `bash -n` parse (not a regex) over every tracked .sh, the
      # same detector the git-sync content guard already runs pre-commit.
      - name: Lint shell script syntax
        if: ${{ !cancelled() }}
        run: npm run lint:shell-syntax

      # Mac build-path bash-3.2 portability guard (EI-18093921841116426 / WI-5769):
      # macOS ships /bin/bash 3.2 system-wide (no Homebrew bash) — a bash-4+ builtin
      # (mapfile, readarray, declare -A, ${var,,}/${var^^}) landing anywhere on the
      # mac build path (mac-vm-build.sh / mac-vm-verify-build.sh / build-mac-cross.sh
      # + their static source/invoke closure) only ever surfaced ~1hr into an actual
      # mac VM build, and recurred twice (2026-07-19, 2026-07-25). GATING — scoped
      # ONLY to the mac build path (many other bin/*.sh legitimately use these
      # builtins on Linux/Windows-cross legs that run a modern bash).
      - name: Lint mac build-path bash-3.2 portability
        if: ${{ !cancelled() }}
        run: npm run lint:mac-bash-portability

      # Assert-integrity guard (WI-5788 / P-411): rig + scenario scripts whose probe
      # FAILING TO RUN reads as a PASS — an unmeasured counter coerced to a permissive
      # baseline, a var pre-set to its own success literal, an empty-read branch that
      # logs and continues. This class is invisible to `bash -n` (the scripts parse
      # fine) and invisible to the live gate (it reports GREEN — that is the bug), so
      # only a static rule catches it. The point-in-time audit that found the first
      # batch was outrun by new scripts within a day; this is the mechanical version
      # so the class cannot re-enter. GATING.
      #
      # NOTE: the lint refuses to report green on an empty scan (MIN_EXPECTED_SCRIPTS)
      # — papercusp-desktop is a SUBMODULE, so a `git ls-files` walk from the
      # superproject finds ZERO scripts here, and a "pass" from scanning nothing would
      # be the exact can-falsely-pass shape this guard exists to catch.
      - name: Lint scenario assert integrity
        if: ${{ !cancelled() }}
        run: npm run lint:assert-integrity

      # Vacuous-negative-assertion guard (EI-18765867705399052): the mirror image of the
      # class above, in the TEST suite. A POSITIVE assertion pinning a literal fails
      # loudly when that string is reworded; a NEGATIVE one starts passing — silently,
      # permanently, and as a direct consequence of doing the rename correctly. The suite
      # then reports a guard it no longer has. checkpoint-run.test.ts held such a dead
      # guard while the very grammar it excluded drifted back into the file
      # (EI-18759622667757826): the dead guard and the regression it was meant to prevent
      # were the same story. GATING on the narrow, decisive case — a PROSE literal that
      # exists nowhere emittable, while a long fragment of it IS in the source (the guard
      # is pinned to that string's OLD wording). Value pins, shape guards and
      # fixture-composed output are reported by `lint:vacuous-negatives:report` and never
      # gate. Replaying the real pre-fix commit through the judge flags that one
      # assertion and only it — pinned in check-vacuous-negative-assertions.test.ts.
      - name: Lint vacuous negative test assertions
        if: ${{ !cancelled() }}
        run: npm run lint:vacuous-negatives

      # Migration forward-compatibility guard (EI-18797473716313783): a migration runs
      # against the SHARED database immediately, but :3070 keeps serving the RELEASE
      # checkout until the next commit -> green-checkpoint -> deploy cycle finishes. For
      # that whole window the database is NEWER than the code querying it, so destructive
      # DDL is not "a schema change" — it is a live change to a contract the currently
      # deployed binary still depends on.
      #
      # Migration 689 did, in ONE file, `CREATE UNIQUE INDEX ... WHERE superseded_at IS
      # NULL` plus `DROP INDEX agent_facts_identity`. The deployed release's facts:assert
      # used an un-predicated `ON CONFLICT (...)`, and Postgres cannot infer a PARTIAL
      # unique index unless the conflict target repeats the predicate — so dropping the
      # old non-partial index left no inferable arbiter and EVERY facts:assert call failed
      # fleet-wide for ~3 HOURS, silently breaking the mandated durable-conclusion path
      # for every looping agent. The code fix was written ~2h41m AFTER the migration
      # applied; during that window staging source and staging schema were mutually
      # inconsistent, which is exactly what this guard turns into a red.
      #
      # GATING on destructive/narrowing DDL without an explicit
      # `-- FORWARD-COMPAT: <reason>` acknowledgment. Fix by splitting expand/contract.
      # Migrations are immutable once applied, so enforcement starts at 693 (the first
      # migration authored after this guard landed) rather than rewriting history.
      # The checker self-tests its own detector against embedded positive/negative
      # fixtures and refuses to report green on an empty scan (D-076 §4 non-vacuity).
      - name: Lint migration forward compatibility
        if: ${{ !cancelled() }}
        run: npm run lint:migration-forward-compat

      # Insight-doc citation guard (WI-1576): an agent-insights doc's `documents:`
      # frontmatter citation that no longer resolves on disk (the cited file was
      # renamed/moved/deleted and the doc never updated) silently points an agent
      # at a file that doesn't exist. GATING — checks every tracked .mdx/.md under
      # apps/operator-docs/src/content/docs/agent-insights/ against the same parse
      # the harness-docs anchor/drift system uses (subject-ref.ts), so this lint
      # and that system can never disagree on what a doc cites.
      - name: Lint agent-insights doc citations resolve on disk
        if: ${{ !cancelled() }}
        run: npm run lint:insight-citations

      # Normative-insight frontmatter guard (unified-agent-state-plane-2026-07-27
      # P-022, per D-028): an insight declaring `normative: true` asserts it is a
      # CONVENTION (something that can be violated, and so something a downstream
      # projector/guard can act on) rather than an explanation. This enforces the one
      # rule that makes the marker meaningful — `normative: true` REQUIRES `governs:`,
      # the trigger/surface the convention applies to. A rule with no stated trigger is
      # worse than an unmarked doc: it inflates the D-016 adoption denominator with an
      # entry nothing can act on. GATING, but never forces opt-in — an unmarked
      # explanatory doc is the corpus default and always passes.
      - name: Lint normative agent-insights declare `governs`
        if: ${{ !cancelled() }}
        run: npm run lint:insight-normative

      # Served-docs completeness guard (EI-20041752458165941): source .mdx/.md
      # pages are committed separately from the generated operator mirror. A
      # source page without both its mapped HTML and exact Markdown twin is a
      # silent 404/stale-reader failure until an unrelated docs rebuild happens.
      # GATING — the same detector also runs at the end of build:inner, after
      # postbuild-copy publishes the mirror.
      - name: Lint served docs mirror completeness
        if: ${{ !cancelled() }}
        run: npm run lint:docs-mirror

      # Rubric method_ref parity guard (EI-8795): rubrics/<id>/METHOD.md and its served
      # apps/operator-docs agent-insights/<id>.mdx twin are hand-synced with no
      # generation link — an author who edits only one leaves docs:search/docs:get (what
      # a grader actually reads) silently stale (WI-3456 landed 21 criteria in METHOD.md
      # while the served mdx stayed at 12, caught a turn later only by hand-diff on
      # WI-3479). GATING — every METHOD.md must have a byte-identical mdx twin
      # (frontmatter aside).
      - name: Lint rubric method_ref (METHOD.md ⇄ agent-insights mdx) parity
        if: ${{ !cancelled() }}
        run: npm run lint:rubric-method-ref-parity

      # TSC type-error gate (lint-tsc-gating-EI-60): operator-core has a
      # pre-existing baseline of type errors. This gates NEW errors above the
      # baseline while allowing legacy errors. Baseline is stored in
      # packages/operator-core/.tsc-baseline.json and updated only
      # intentionally (npm run lint:tsc -- --update).
      - name: Lint TSC type errors (gates new errors, allows pre-existing baseline)
        if: ${{ !cancelled() }}
        run: npm run lint:tsc

      # EI-19372643177590910: the two sibling per-project tsc baseline gates were
      # DARK — defined in package.json, invoked by NOTHING. No CI step, no
      # green-checkpoint leg, no aggregate script chained them, so they could only
      # ever run if a human typed them by hand.
      #
      # That is worse than having no gate, because both baselines DOCUMENT
      # themselves as enforced and are read that way. The orchestrator baseline
      # says, in its own note: "Do not read `files: {}` as 'not set up yet': the
      # gate runs ... so ANY new type error in this package is a red naming the
      # file." WI-6826 seeded that baseline at 59 errors and WI-6838 paid every
      # one of them off to reach a strict zero across ~152 sources — a zero that
      # was then protected by nothing at all. A ratchet nobody turns is not a
      # ratchet; it is a comment.
      #
      # Both were measured green on COMMITTED code before being wired on here,
      # which is the only measurement that counts: run locally, this shared tree
      # shows every peer's half-written file (two files failed TS1xxx parse checks
      # purely because they were mid-edit, and both parsed cleanly at HEAD), while
      # these gates actually execute against a clean checkout of a single sha.
      # Measuring blast radius on the dirty tree would have argued against wiring
      # them on, for reasons that do not exist where they run.
      - name: Lint TSC type errors — operator-vite (per-file baseline ratchet)
        if: ${{ !cancelled() }}
        run: npm run lint:tsc:operator-vite

      - name: Lint TSC type errors — orchestrator (strict zero, no tolerance)
        if: ${{ !cancelled() }}
        run: npm run lint:tsc:orchestrator

      # EI-19391297380137349: the SAME dark-gate defect, one sibling later.
      # `lint:tsc:operator` (scripts/lint-tsc-operator.mjs + apps/operator/.tsc-baseline.json)
      # was created 2026-08-02 to ratchet apps/operator's ~580 standing errors — the same day
      # the block above wired its two siblings on — and it landed invoked by NOTHING: no CI
      # step, no green-checkpoint leg, no aggregate. Measured exhaustively 2026-08-04, every
      # reference to it was documentation, its own usage header, or tests of its ROUTING
      # BANNER; zero callers.
      #
      # This one matters more than its siblings: apps/operator holds the release gate itself
      # (lib/release/green-checkpoint.ts), so the workspace whose type-correctness protects
      # every other gate was the one with an unenforced ratchet. It has already cost real
      # work — an agent shipped 5 fresh type errors into green-checkpoint.test.ts believing
      # they were pre-existing, and this gate flagged them instantly once finally run BY HAND.
      #
      # CI rather than a fifth green-checkpoint leg, deliberately, following the precedent
      # green-checkpoint.ts:4828 states for operator-vite ("deliberately NOT a leg: ~151
      # baseline entries"): apps/operator's baseline is several hundred entries, and putting
      # that in front of every fleet release buys nothing CI does not already catch.
      #
      # Measured green before wiring on, per the note above: `npm run lint:tsc:operator`
      # returned `LINT_TSC_RESULT label=operator scope=all exit=0 status=clean` (574 errors
      # vs baseline 584, 6 files BELOW baseline, none above). That run was on the dirty
      # shared tree, which carries every peer's half-written file, so a clean result there is
      # strictly stronger evidence than the clean single-sha checkout CI actually runs.
      - name: Lint TSC type errors — apps/operator (per-file baseline ratchet)
        if: ${{ !cancelled() }}
        run: npm run lint:tsc:operator

      # Vite externalized-module guard (EI-7275): a `vite build` warning "Module
      # node:* has been externalized for browser compatibility" means a Node-only
      # module reached the SPA's entry graph — the externalized stub THROWS on
      # property ACCESS at module-eval time, blanking the whole app the instant
      # a route evaluates it (shipped for real on 2026-07-04: tooldef's
      # run-script.ts statically imported node:worker_threads). GATING on a NEW
      # warning above the committed baseline count
      # (apps/operator-vite/.externalized-warnings-baseline.json); a shrink-only
      # ratchet, updated only intentionally (npm run lint:vite-externalized -- --update).
      - name: Lint vite build for new externalized-module warnings
        if: ${{ !cancelled() }}
        run: npm run lint:vite-externalized

      # Vite EAGER externalized-reach guard (WI-4518): the sibling gate above counts
      # ALL externalized warnings, but the vast majority sit behind `await import()`
      # lazy-chunk boundaries and are benign. The genuine white-page risk is a server
      # builtin reached EAGERLY (static `import` edges from the SPA entry, no lazy
      # boundary) — it blanks the whole app when its module evaluates (2026-07-04,
      # 2026-07-12). This guard classifies eager-vs-lazy via the REAL build graph and
      # HARD-FAILS + names the client import chain on any non-allowlisted eager reach.
      # Allowlist: browser-polyfilled builtins only (buffer). See
      # scripts/trace-vite-externalized.mjs.
      - name: Lint vite build for EAGER server-module reach (white-page guard)
        if: ${{ !cancelled() }}
        run: npm run lint:vite-eager

      # Drizzle drift: regenerate generated.ts from the live test PG and
      # fail if it differs from HEAD. Proves `.sql` is the source of
      # truth (PRs that forget to re-run pull-schema fail here).
      # Reuses HARNESS_ADMIN_DATABASE_URL set up by the integration tests.
      - name: Drizzle drift check (informational — does not gate)
        if: always()
        continue-on-error: true
        run: npm run lint:drizzle-drift

      # Zero-config drift: assert zero-config.json's per-table column
      # lists match what drizzle-zero infers from generated.ts. Catches
      # forgotten new columns + stale config entries.
      - name: Zero-config drift check (informational — does not gate)
        if: always()
        continue-on-error: true
        run: node libs/zero-harness/scripts/drizzle-zero-cross-check.mjs


      - name: Knip (informational — does not gate)
        if: always()
        continue-on-error: true
        run: npx knip --no-config-hints --reporter compact

      # WI-7151: moved here (was right after "Cache testcontainers", before the ~50
      # "Lint …" / "Check …" steps above). This step is the slow one — the dev-box
      # green-checkpoint's UNIT-ONLY equivalent already measures ~55min, and
      # --integration adds ~682 real-testcontainers *.integration.test.ts files on
      # top — so on the OLD ordering, the job's timeout (formerly 15min) reliably
      # killed the job WHILE this step was still running, and every step below it
      # (all ~50 gating lints) never even started: GitHub reports a cancelled step
      # as neither pass nor fail, so those lints silently got ZERO evaluations for
      # weeks. Running the fast fs-only lints FIRST means they get a real verdict
      # recorded even on a run where this step (or the timeout) still doesn't leave
      # enough time to finish — only this step and Desktop tests are exposed to a
      # timeout now, not the whole gating suite. Paired with the raised
      # `timeout-minutes` on this job (see the job-level comment above).
      - name: Cache testcontainers Docker layer
        if: ${{ !cancelled() }}
        uses: actions/cache@v4
        with:
          path: ~/.testcontainers
          key: testcontainers-${{ runner.os }}-postgres-16-alpine

      - name: Run affected unit + integration suites
        if: ${{ !cancelled() }}
        env:
          # WI-7013: on a pull_request run, github.event.inputs.base is unset (that
          # event carries no `inputs`), so this falls through to the unchanged
          # origin/${{ github.base_ref }} diff. On a workflow_dispatch run — the ONLY
          # way this workflow ever actually fires on `main`, see the trigger comment
          # above — github.event.inputs.base carries the pre-FF main sha
          # green-checkpoint passed, so the diff is against what this promotion
          # actually changed instead of origin/main == HEAD (an always-empty diff
          # that reported `tasks=0 status=passed` having verified nothing).
          AFFECTED_BASE: ${{ github.event.inputs.base || format('origin/{0}', github.base_ref || 'main') }}
          CI: 'true'
        run: node scripts/affected-tests.mjs --integration

      # papercusp-desktop tests (WI-6074). This submodule is NOT a member of the
      # root package.json `workspaces` array, so `affected-tests.mjs` above can
      # never select any of its tests — before this step, NOTHING in CI or the
      # green-checkpoint gate ran a single papercusp-desktop test, and the whole
      # workspace (the live-federation rig + release-leg scripts) was untested.
      # It is present here because `actions/checkout` uses submodules: recursive.
      #
      # Both suites below are verified GREEN and verified HERMETIC by re-running
      # them with docker/ssh/scp/rsync shadowed by exit-127 stubs on PATH: zero
      # egress attempts, 7/7 selftests + 27/27 build-script guards still passing.
      # They need no node_modules of their own (node: builtins + bash only),
      # which matters because the root install does not cover this submodule.
      #
      # test:config is included as of WI-6075: it was RED (the 2GB hive seed was
      # being packaged into the GUI/base bundle, which that test exists to forbid),
      # so wiring it earlier would have redded the gate for the whole fleet. WI-6075
      # removed seed/**/* from the base config and gave the gate its own explicit
      # tauri.gate.conf.json overlay, and the test now also pins that overlay — so
      # it guards both halves of the split. Verified green (2/2) before wiring.
      #
      # Deliberately NOT wired here:
      #   test:rust   — needs a Rust toolchain this job does not install.
      - name: Desktop tests (papercusp-desktop selftests + build-script guards)
        if: ${{ !cancelled() }}
        working-directory: papercusp-desktop
        run: |
          npm run test:selftests
          npm run test:shell
          npm run test:config

      - name: Publish JUnit reports
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: vitest
          path: '**/junit.xml'
          reporter: java-junit
          fail-on-error: false

  e2e:
    name: E2E (operator)
    needs: affected
    runs-on: ubuntu-latest
    timeout-minutes: 20
    if: |
      contains(github.event.pull_request.labels.*.name, 'run-e2e') ||
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          # Private Papercusp/* submodules need a credential to clone. Add a repo
          # secret SUBMODULES_PAT (classic PAT with repo:read on the org, or a
          # fine-grained PAT scoped to the submodule repos) — or switch to SSH
          # deploy keys. Without it, `submodules: recursive` fails at checkout and
          # the whole suite never runs (this was the root cause of CI being red).
          token: ${{ secrets.SUBMODULES_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: |
          npm install --global "$(node -p "require('./package.json').packageManager")"
          npm ci --legacy-peer-deps

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Playwright Chromium
        run: npx --workspace apps/operator playwright install --with-deps chromium

      - name: Build operator (next standalone)
        working-directory: apps/operator
        run: npm run build

      - name: Run E2E
        working-directory: apps/operator
        env:
          CI: 'true'
        run: npm run test:e2e

      - name: Publish E2E report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: apps/operator/playwright-report
          if-no-files-found: ignore

      - name: Publish E2E JUnit
        if: always()
        uses: dorny/test-reporter@v2
        with:
          name: playwright
          path: apps/operator/junit-e2e.xml
          reporter: java-junit
          fail-on-error: false

  visual:
    name: Visual regression (Lost Pixel)
    needs: affected
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Per spec §1.11: visual regression is opt-in via PR label, plus
    # auto-applied when story files touch (CODEOWNERS handles the latter
    # by adding the label automatically — wire that separately).
    if: |
      contains(github.event.pull_request.labels.*.name, 'run-visual') ||
      github.event_name == 'push'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive
          # Private Papercusp/* submodules need a credential to clone. Add a repo
          # secret SUBMODULES_PAT (classic PAT with repo:read on the org, or a
          # fine-grained PAT scoped to the submodule repos) — or switch to SSH
          # deploy keys. Without it, `submodules: recursive` fails at checkout and
          # the whole suite never runs (this was the root cause of CI being red).
          token: ${{ secrets.SUBMODULES_PAT || github.token }}

      - uses: actions/setup-node@v4
        with:
          node-version: 25
          cache: npm

      - name: Install dependencies
        run: |
          npm install --global "$(node -p "require('./package.json').packageManager")"
          npm ci --legacy-peer-deps

      - name: Cache Playwright browsers
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('**/package-lock.json') }}

      - name: Install Lost Pixel's pinned Chromium
        run: node node_modules/lost-pixel/node_modules/playwright-core/cli.js install chromium

      # A SECOND browser, deliberately. Lost Pixel pins its own nested
      # playwright-core (1.47.2 -> chromium-1217); operator-core depends on the
      # hoisted playwright-core (1.59.1 -> chromium-1234) and that is what the
      # design-evidence capture launches. Installing only Lost Pixel's leaves
      # the design-evidence step failing on a missing executable EVERY run —
      # and because that step is `continue-on-error`, it would fail quietly
      # forever: a report-only stage that never reports. Locally this is
      # invisible, because a dev box accumulates both browser builds in
      # ~/.cache/ms-playwright.
      # `ci-wiring.test.ts` derives the required version from the resolved
      # package rather than restating it, so a version bump cannot silently
      # re-open this.
      - name: Install the Chromium operator-core's playwright-core launches
        run: node node_modules/playwright-core/cli.js install chromium

      - name: Build Storybook (ui-primitives)
        working-directory: libs/generic/ui-primitives
        run: npm run build-storybook

      - name: Lost Pixel comparison (ui-primitives)
        working-directory: libs/generic/ui-primitives
        run: npm run lostpixel

      - name: Build Storybook (marketplace-public-ui)
        working-directory: libs/marketplace-public-ui
        run: npm run build-storybook

      - name: Lost Pixel comparison (marketplace-public-ui)
        working-directory: libs/marketplace-public-ui
        run: npm run lostpixel

      - name: Build Storybook (agent-chat)
        working-directory: libs/agent-chat
        run: npm run build-storybook

      - name: Lost Pixel comparison (agent-chat)
        working-directory: libs/agent-chat
        run: npm run lostpixel

      - name: Build Storybook (operator)
        working-directory: apps/operator
        run: npm run build-storybook

      - name: Lost Pixel comparison (operator)
        working-directory: apps/operator
        run: npm run lostpixel

      # ─────────────────────────────────────────────────────────────────────
      # Design evidence (plan ratified-mockup-implementation-validation-2026-08-24,
      # P-008). REPORT-ONLY per D-006: it publishes evidence and gates nothing.
      #
      # Placement is load-bearing and must stay AFTER every `npm run lostpixel`
      # step above:
      #   * `if: always()` so it still runs when a Lost Pixel comparison has
      #     already failed the job. It does not rescue that failure — the job's
      #     conclusion is still the Lost Pixel step's.
      #   * `continue-on-error: true` so a fault in this instrument can never
      #     turn a green build red. The report's own exit code stays honest
      #     (non-zero on a harness failure) and shows up in the step's
      #     annotation rather than being swallowed inside the script.
      # `ci-wiring.test.ts` pins all three of those properties, plus the fact
      # that the Lost Pixel steps above still gate.
      - name: Design evidence report (report-only)
        if: always()
        continue-on-error: true
        run: npm run design:evidence-report

      - name: Upload design evidence report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: design-evidence-report
          path: design-evidence-report
          # Explicit rather than inherited: an unstated retention is the repo
          # default silently applied, which is a policy nobody chose and nobody
          # can see. 14 days outlasts a PR review cycle without accumulating
          # megabytes of captures indefinitely.
          retention-days: 14
          if-no-files-found: warn

      - name: Upload diff artifacts on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: lost-pixel-diffs
          path: |
            libs/generic/ui-primitives/lostpixel-current
            libs/generic/ui-primitives/lostpixel-diff
            libs/marketplace-public-ui/lostpixel-current
            libs/marketplace-public-ui/lostpixel-diff
            libs/agent-chat/lostpixel-current
            libs/agent-chat/lostpixel-diff
            apps/operator/lostpixel-current
            apps/operator/lostpixel-diff
          # Was previously unset, inheriting the repo default. Stated so the
          # retention of regression evidence is a decision on the page.
          retention-days: 14
          if-no-files-found: ignore

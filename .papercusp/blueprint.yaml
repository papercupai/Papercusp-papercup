id: papercusp
extends: papercusp-engineer
kind: pot
version: 0.1.1
description: "Papercusp's own engineering pot: senior su collaborators work the shared staging tree,
  coordinate through work items and plans, and ship through the green-checkpoint release gate."
knobs:
  releaseGate:
    # Clones of this pot can have a GitHub default branch of `main`; keep the
    # release gate pointed at the staging integration branch so it can promote.
    integrationBranch: staging
workItem:
  kind: feature
  idPrefix: WI
spine:
  decider: su
  claimModel: self-claim-priority
  default:
    to: idle
roles:
  - id: su
    description: Senior engineer-collaborator with operator and admin authority.
  - id: operator
    description: Executes a bounded, owner-authorized operator-config or release operation with
      independent preflight and verification. Launched explicitly; the pot's su decider never
      dispatches this role automatically.
lexicon:
  workUnit: work item
  reviewGate: green checkpoint
fleet:
  workerRoles:
    - id: su
      capabilities:
        - "*"
    - id: operator
      capabilities:
        - operator:write
    - id: researcher
      capabilities:
        - "capability:fetch"
        - "capability:read"
        - "work_items:get"
        - "work_items:claim"
        - "work_items:complete"
        - "plans:get"
        - "reports:publish"
        - "reports:get"
        - "reports:list"
        - "coord:send"
  watcher: papercup

<body>
<header class="gallerybar"><div class="gallerybrand row"><span class="brand">p</span><div><strong>Quick Access. Three ways in.</strong><small>Independent desktop popup · Plans, reports & agent windows</small></div></div><nav class="conceptnav" aria-label="Display concepts"><button data-concept="launcher"><b>A</b>Search launcher</button><button data-concept="board"><b>B</b>Visual board</button><button data-concept="agenda"><b>C</b>Compact agenda</button></nav></header>
<div class="caption"><span id="caption"></span><span class="tag">Interactive design concepts · illustrative data</span></div>

<dialog id="detail-dialog" aria-label="Quick access detail"><div id="dialog-content"></div></dialog>
<script>
'use strict';
const shape={search:'<circle cx="10.5" cy="10.5" r="6.5"/><path d="m16 16 4.5 4.5"/>',arrow:'<path d="M4 12h15m-5-5 5 5-5 5"/>',expand:'<path d="M8 3H3v5M16 3h5v5M3 16v5h5M21 16v5h-5"/>',close:'<path d="m6 6 12 12M18 6 6 18"/>',plan:'<rect x="5" y="4" width="14" height="17" rx="2"/><path d="M9 2h6v4H9zM9 11h6M9 15h6"/>',report:'<path d="M5 3h10l5 5v13H5zM15 3v6h5M9 13h7M9 17h5"/>',people:'<circle cx="9" cy="7" r="3"/><path d="M3 21v-3a6 6 0 0 1 12 0v3M17 4a3 3 0 0 1 0 6M18 15a4 4 0 0 1 3 4v2"/>',chat:'<path d="M21 11a8 8 0 0 1-8 8H7l-5 3 2-6a8 8 0 1 1 17-5Z"/><path d="M8 10h8M8 14h5"/>',alert:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6M12 17v.1"/>',check:'<path d="m5 12 4 4L19 6"/>',chevron:'<path d="m9 6 6 6-6 6"/>',up:'<path d="M12 20V4m-6 6 6-6 6 6"/>',clock:'<circle cx="12" cy="12" r="9"/><path d="M12 7v6l4 2"/>'};
const icon=n=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(shape[n]||shape.plan)+'</svg>';
const esc=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const agents={maya:{id:'maya',name:'Maya',initials:'MY',role:'Interface · Codex',task:'Connecting plans and conversations',state:'Working',plan:'interface'},leo:{id:'leo',name:'Leo',initials:'LE',role:'Desktop · Claude',task:'Refining the native popup behavior',state:'Working',plan:'interface'},rue:{id:'rue',name:'Rue',initials:'RU',role:'Review · Codex',task:'Waiting for the display direction',state:'Waiting',plan:'interface'},nova:{id:'nova',name:'Nova',initials:'NV',role:'Workflow · Claude',task:'Building the first customer journey',state:'Working',plan:'onboarding'},kai:{id:'kai',name:'Kai',initials:'KA',role:'Performance · Codex',task:'Completed the performance review',state:'Ended',plan:'performance'}};
const plans=[
{id:'interface',title:'Plans & conversations',area:'Desktop experience',state:'Active',done:6,total:9,age:'Just now',note:'Choose the desktop display direction',description:'Keep your plans, reports, and the people doing the work one shortcut away.',agents:['maya','leo','rue'],reports:['direction','desktop']},
{id:'onboarding',title:'CRM agent onboarding',area:'Customer experience',state:'Active',done:4,total:7,age:'3m ago',description:'Guide a customer from their first conversation to a working account.',agents:['nova'],reports:['onboarding']},
{id:'cloud',title:'Cloud workspace setup',area:'Infrastructure',state:'Active',done:3,total:8,age:'12m ago',note:'No agent working — choose who continues',description:'Make a new workspace easy to connect and ready for its first task.',agents:[],reports:[]},
{id:'calendar',title:'Calendar & email handoff',area:'Apps',state:'Ready',done:0,total:5,age:'1h ago',description:'Hand the right conversation to the calendar and email workflow.',agents:[],reports:[]},
{id:'welcome',title:'A better first-run welcome',area:'Onboarding',state:'Draft',done:0,total:6,age:'2h ago',description:'Help a new teammate understand the workspace and start a useful plan.',agents:[],reports:[]},
{id:'performance',title:'Desktop performance',area:'Desktop experience',state:'Done',done:8,total:8,age:'Yesterday',description:'Make the desktop feel fast and keep everyday navigation responsive.',agents:['kai'],reports:[]}
];
const reports=[
{id:'direction',title:'Plans & conversations — design direction',short:'The desktop display direction',kind:'Design proposal',author:'maya',plan:'interface',age:'12m ago',summary:'A separate desktop popup puts plans, reports, conversations and agent windows within reach.',sections:[['Three different ways to find the work','A search launcher is quickest when you know what you want. A visual board helps you see several workstreams at once. A compact agenda makes decisions and today’s activity easy to scan.'],['A separate desktop surface','The popup has its own window and lifecycle. Reports open here, and each agent has a direct Focus window action. The main application does not need to be the place you navigate through.'],['Keep the two actions distinct','Open conversation lets you read and talk within the popup. Focus window brings the exact agent’s existing working window to the front.']]},
{id:'desktop',title:'Desktop interaction review',short:'Shortcut, focus & window behavior',kind:'Review',author:'leo',plan:'interface',age:'28m ago',summary:'Keep the popup independent, open it on the current display, and make the path to the agent’s working window explicit.',sections:[['Window behavior','Use a configurable shortcut and a separate window. Dismiss the popup to return to the app you were using.'],['Agent windows','Focus the exact agent window and restore it if minimized. If a session has ended or is headless, explain that there is no live window to focus.'],['Acceptance','Native global shortcut, focus restoration and multi-monitor behavior need implementation and native acceptance testing. This is an illustrative local mockup.']]},
{id:'onboarding',title:'First customer onboarding — progress',short:'First customer journey',kind:'Progress report',author:'nova',plan:'onboarding',age:'1h ago',summary:'Four of seven tasks are complete. The first customer journey is taking shape.',sections:[['Moving forward','The first conversation and account context are drafted. The next step is the calendar handoff.'],['Next decision','Review the first journey before broadening it to more customer types.'],['Continue the work','Talk to Nova about the plan, or focus Nova’s working window using the button above.']]}
];
const params=new URLSearchParams(location.search),concepts=['launcher','board','agenda'];
let concept=concepts.includes(params.get('concept'))?params.get('concept'):'launcher',query='',scope='All',selected='plan:interface',agendaOpen='interface',agendaArea='plans',dismissed=false;
const dialog=document.getElementById('detail-dialog'),messageStore=new Map(),previewWindows=new Map();
function byPlan(id){return plans.find(p=>p.id===id)}function byReport(id){return reports.find(r=>r.id===id)}
function avatar(a){return '<span class="avatar '+a.id+'">'+a.initials+'</span>'}
function badge(p){const c={Active:'',Ready:'blue',Draft:'lilac',Done:''}[p.state];return '<span class="badge '+c+'"><i class="dot '+c+'"></i>'+p.state+'</span>'}
function progress(p){return '<div class="progress"><i style="width:'+Math.round(p.done/p.total*100)+'%"></i></div>'}
function focus(a,short=true){return '<button class="secondary focus" data-focus="'+a.id+'" aria-label="Focus '+a.name+' window" '+(a.state==='Ended'?'disabled':'')+'>'+icon('expand')+(a.state==='Ended'?'No live window':short?'Focus window':'Focus '+a.name+'’s window')+'</button>'}
function person(a){return '<div class="person">'+avatar(a)+'<div><div class="name">'+a.name+' <span class="mute tiny">· '+a.role.split(' · ')[1]+'</span></div><div class="meta">'+a.task+'</div></div><div class="actions"><button class="talk" data-chat="'+a.id+'" aria-label="Talk to '+a.name+'">Talk</button>'+focus(a)+'</div></div>'}
function titlebar(name){return '<div class="winbar"><span class="brand">p</span><span class="title">'+name+'</span><span class="ws">Avi’s workspace</span><span class="grow"></span><div class="traffic"><i></i><i></i></div><button class="iconbtn" data-dismiss aria-label="Dismiss popup">'+icon('close')+'</button></div>'}
function foot(){return '<div class="winfoot"><span><kbd class="key">Esc</kbd> Dismiss</span><span><kbd class="key">/</kbd> Search</span><span class="hint"><kbd class="key">A / B / C</kbd> Compare layouts</span><span class="grow"></span><span>Local mockup · separate popup</span></div>'}
function os(){return '<div class="osbar"><strong>Desktop</strong><span>File</span><span>View</span><span class="center">Monday, October 26 &nbsp; 9:41</span><span class="grow"></span><span class="row" style="gap:6px"><i class="dot"></i>Papercusp</span></div>'}
function search(placeholder){return '<label class="searchbox">'+icon('search')+'<input aria-label="Search plans, agents and reports" placeholder="'+placeholder+'" value="'+esc(query)+'"><kbd class="key">/</kbd></label>'}
function filteredPlans(){const q=query.toLowerCase();return plans.filter(p=>(p.title+' '+p.area+' '+p.agents.map(id=>agents[id].name).join(' ')).toLowerCase().includes(q))}
function findResults(){const q=query.toLowerCase();return [
...plans.filter(p=>!q||(p.title+' '+p.area+' '+p.agents.map(id=>agents[id].name).join(' ')).toLowerCase().includes(q)).map(p=>({kind:'Plans',key:'plan:'+p.id,id:p.id,title:p.title,meta:p.done+' of '+p.total+' tasks · '+p.state,age:p.age})),
...Object.values(agents).filter(a=>!q||(a.name+' '+a.role+' '+byPlan(a.plan).title).toLowerCase().includes(q)).map(a=>({kind:'Agents',key:'agent:'+a.id,id:a.id,title:a.name,meta:a.task,age:a.state})),
...reports.filter(r=>!q||(r.title+' '+agents[r.author].name+' '+r.kind).toLowerCase().includes(q)).map(r=>({kind:'Reports',key:'report:'+r.id,id:r.id,title:r.short,meta:r.kind+' · '+agents[r.author].name,age:r.age}))
].filter(r=>scope==='All'||r.kind===scope)}
function resultRows(){const results=findResults();if(!results.some(r=>r.key===selected)&&results.length)selected=results[0].key;let last='';return results.map(r=>{const head=r.kind!==last?'<div class="sectionhead">'+r.kind+'<span>'+results.filter(x=>x.kind===r.kind).length+'</span></div>':'';last=r.kind;return head+'<button class="result '+(selected===r.key?'active':'')+'" data-result="'+r.key+'" aria-label="Preview '+esc(r.title)+'">'+(r.kind==='Agents'?avatar(agents[r.id]):'<span class="ricon">'+icon(r.kind==='Reports'?'report':'plan')+'</span>')+'<span class="text"><span class="name" style="display:block">'+esc(r.title)+'</span><span class="meta" style="display:block">'+r.meta+'</span></span><span class="age">'+r.age+'</span>'+(selected===r.key?'<span class="enter">↵</span>':'')+'</button>'}).join('')||'<div class="empty">No matches. Try a plan, person, or report name.</div>'}
function reportLink(id){const r=byReport(id);return '<button class="reportlink" data-report="'+r.id+'">'+icon('report')+'<span>'+r.short+'</span><span class="arrow">'+icon('arrow')+'</span></button>'}
function preview(){const [kind,id]=selected.split(':');if(kind==='agent'){const a=agents[id];return '<div class="eyebrow">Agent · '+a.role+'</div><div class="row" style="margin-top:14px">'+avatar(a)+'<h1 style="margin:0">'+a.name+'</h1></div><p class="description" style="margin-top:15px">'+a.task+'</p><div class="badge" style="margin-top:15px"><i class="dot"></i>'+a.state+'</div><div class="sectionhead">Working on</div><button class="reportlink" data-plan="'+a.plan+'">'+icon('plan')+byPlan(a.plan).title+'</button><div class="row" style="margin-top:22px;flex-wrap:wrap"><button class="primary" data-chat="'+a.id+'">'+icon('chat')+' Conversation</button>'+focus(a)+'</div><p class="study-note">One action to talk here. Another to bring their working window to the front.</p>'}if(kind==='report'){const r=byReport(id),a=agents[r.author];return '<div class="eyebrow">'+r.kind+'</div><h1>'+r.title+'</h1><p class="description">'+r.summary+'</p><div class="person" style="margin-top:16px">'+avatar(a)+'<div><div class="name">'+a.name+'</div><div class="meta">'+r.age+'</div></div></div><div class="row" style="margin-top:22px;flex-wrap:wrap"><button class="primary" data-report="'+r.id+'">'+icon('report')+' Read report</button>'+focus(a)+'</div>'}const p=byPlan(id);return '<div class="row">'+badge(p)+'<span class="grow"></span><span class="tiny mute">'+p.area+'</span></div><h1>'+p.title+'</h1><p class="description">'+p.description+'</p><div class="meta"><span>'+p.done+' of '+p.total+' tasks</span><span>'+Math.round(p.done/p.total*100)+'%</span></div>'+progress(p)+(p.note?'<div class="decision">'+icon('alert')+'<span>'+p.note+'<small>Needs your attention</small></span></div>':'')+'<div class="sectionhead">People on this plan</div>'+(p.agents.length?p.agents.map(id=>person(agents[id])).join(''):'<div class="empty" style="padding-left:0">No agent assigned.</div>')+(p.reports.length?'<div class="sectionhead">Reports</div>'+p.reports.map(reportLink).join(''):'')}
function launcher(){return '<section class="window launcher" aria-label="Search launcher popup">'+titlebar('Quick Access')+'<div class="launcher-top">'+search('Find a plan, report, or person…')+'<div class="scopes" aria-label="Search scope">'+['All','Plans','Agents','Reports'].map(s=>'<button data-scope="'+s+'" class="'+(scope===s?'active':'')+'" aria-pressed="'+(scope===s)+'">'+s+' <small>'+({All:14,Plans:6,Agents:5,Reports:3}[s])+'</small></button>').join('')+'<span class="grow"></span><span class="tiny mute">Search everything. Go anywhere.</span></div></div><div class="launcher-body"><div class="resultlist" id="results">'+resultRows()+'</div><aside class="preview" aria-label="Selection preview">'+preview()+'</aside></div>'+foot()+'</section>'}
function card(p){const a=agents[p.agents[0]];return '<article class="plancard '+(p.note?'attention':'')+'"><button class="cardtitle" data-plan="'+p.id+'"><span class="row">'+badge(p)+'<span class="grow"></span><span class="tiny mute">'+p.age+'</span></span><h2>'+p.title+'</h2><p class="desc">'+p.description+'</p></button><div class="progressmeta"><span>'+p.done+' of '+p.total+' tasks</span><span>'+Math.round(p.done/p.total*100)+'%</span></div>'+progress(p)+(p.note?'<div class="callout">'+icon('alert')+p.note+'</div>':'')+(a?'<div class="cardbottom"><button class="row" style="gap:7px;padding:0" data-chat="'+a.id+'" aria-label="Talk to '+a.name+'">'+avatar(a)+'<span class="agentname">'+a.name+(p.agents.length>1?' + '+(p.agents.length-1):'')+'</span></button>'+focus(a)+'</div>':'<div class="cardbottom tiny mute">No agent assigned</div>')+'</article>'}
function board(){const list=filteredPlans(),groups=[{name:'Needs you',color:'amber',rows:list.filter(p=>p.note)},{name:'In motion',color:'',rows:list.filter(p=>p.state==='Active'&&!p.note)},{name:'Up next',color:'blue',rows:list.filter(p=>p.state==='Ready'||p.state==='Draft')}];return '<section class="window board" aria-label="Visual board popup">'+titlebar('Your work, at a glance')+'<div class="boardtop"><div><h1>A little perspective.</h1><p>See what needs you, what is moving, and what comes next.</p></div><span class="grow"></span>'+search('Find a plan or agent…')+'<button class="secondary" data-report="direction">'+icon('report')+' Latest report</button></div><div class="boardbody"><div class="boardcols">'+groups.map(g=>'<section class="column"><div class="columnhead"><i class="dot '+g.color+'"></i>'+g.name+'<small>'+g.rows.length+'</small></div>'+g.rows.map(p=>(p.state==='Ready'||p.state==='Draft')?'<article class="nextcard"><button data-plan="'+p.id+'">'+badge(p)+'<h3>'+p.title+'</h3><p>'+p.total+' tasks · '+p.area+'</p></button></article>':card(p)).join('')+(g.rows.length?'':'<p class="empty">No plans here.</p>')+'</section>').join('')+'</div><section class="recent-reports"><div class="sectionhead">Recent reports<span>Read without leaving this popup</span></div><div class="reportshelf">'+reports.map(r=>'<button class="reporttile" data-report="'+r.id+'">'+icon('report')+'<span><h3>'+r.short+'</h3><p>'+agents[r.author].name+' · '+r.kind+' · '+r.age+'</p></span></button>').join('')+'</div></section></div><div class="livebar"><span class="eyebrow">Your people<br>One click away</span>'+Object.values(agents).filter(a=>a.state!=='Ended').map(a=>'<div class="liveagent">'+avatar(a)+'<span class="name">'+a.name+'<small>'+a.state+'</small></span><button data-chat="'+a.id+'" aria-label="Talk to '+a.name+'">'+icon('chat')+'</button><button data-focus="'+a.id+'" aria-label="Focus '+a.name+' window">'+icon('expand')+' Focus</button></div>').join('')+'<span class="grow"></span><span class="tiny mute">3 working · 1 waiting</span></div>'+foot()+'</section>'}
function agendaItem(p){const a=agents[p.agents[0]],open=agendaOpen===p.id;return '<article class="agenda-item '+(open?'open':'')+'"><div class="agendarow"><i class="dot '+(p.note?'amber':p.state==='Ready'?'blue':p.state==='Draft'?'lilac':'')+'"></i><button class="lead" data-expand="'+p.id+'" aria-expanded="'+open+'"><h2>'+p.title+'</h2><p>'+(p.note||p.area+' · '+(a?a.name:'No agent assigned'))+'</p></button><span class="tinyprogress">'+p.done+' / '+p.total+progress(p)+'</span>'+(a?focus(a):'<span class="tiny mute" style="min-width:65px;text-align:right">'+p.state+'</span>')+'<button class="chevron" data-expand="'+p.id+'" aria-label="'+(open?'Collapse':'Expand')+' '+p.title+'">'+icon('chevron')+'</button></div>'+(open?'<div class="agendadetail">'+(p.note?'<div class="decision">'+icon('alert')+'<span>'+p.note+'</span></div>':'')+(p.agents.length?p.agents.map(id=>person(agents[id])).join(''):'<p class="tiny mute">No agent is currently working on this plan.</p>')+p.reports.map(reportLink).join('')+'</div>':'')+'</article>'}
function agendaContent(){if(agendaArea==='reports'){const q=query.toLowerCase(),rs=reports.filter(r=>(r.title+' '+agents[r.author].name).toLowerCase().includes(q));return '<div class="agenda-group">Recent reports</div>'+rs.map(r=>'<button class="agenda-report" data-report="'+r.id+'">'+icon('report')+'<span><h2>'+r.title+'</h2><p>'+r.kind+' · '+agents[r.author].name+' · '+r.age+'</p></span><span class="arrow">'+icon('arrow')+'</span></button>').join('')+(rs.length?'':'<p class="empty">No matching reports.</p>')}if(agendaArea==='agents'){const as=Object.values(agents).filter(a=>(a.name+' '+a.role).toLowerCase().includes(query.toLowerCase()));return '<div class="agenda-group">People & windows</div><div class="agendapeople">'+as.map(person).join('')+(as.length?'':'<p class="empty">No matching agents.</p>')+'</div>'}const list=filteredPlans(),groups=[['Decisions & handoffs',list.filter(p=>p.note),'attn'],['Moving forward',list.filter(p=>p.state==='Active'&&!p.note),''],['For later',list.filter(p=>p.state==='Ready'||p.state==='Draft'),''],['Finished',list.filter(p=>p.state==='Done'),'']];return groups.filter(g=>g[1].length).map(g=>'<div class="agenda-group '+g[2]+'">'+(g[2]?icon('alert'):'')+g[0]+'<span class="grow"></span><span>'+g[1].length+'</span></div>'+g[1].map(agendaItem).join('')).join('')||'<p class="empty">No matching plans.</p>'}
function agenda(){return '<section class="window agenda" aria-label="Compact agenda popup">'+titlebar('Quick Access')+'<header class="agendahead"><div class="date">MONDAY, OCTOBER 26</div><div class="row"><h1>The work, in a moment.</h1><span class="grow"></span><span class="badge amber">2 need you</span></div><p class="summary">6 plans · 3 agents working · 3 recent reports</p><nav class="scopes" aria-label="Agenda sections">'+[['plans','Plans','6'],['reports','Reports','3'],['agents','People & windows','5']].map(([id,label,n])=>'<button data-agenda="'+id+'" class="'+(agendaArea===id?'active':'')+'" aria-pressed="'+(agendaArea===id)+'">'+label+'<small>'+n+'</small></button>').join('')+'</nav>'+search(agendaArea==='reports'?'Find a report or author…':agendaArea==='agents'?'Find a person…':'Find a plan or person…')+'</header><div class="agendacontent" id="agenda-content">'+agendaContent()+'</div><div class="agendafoot"><i class="dot"></i><span>Maya just shared a design proposal</span><span class="grow"></span><button class="tiny" style="color:var(--mint)" data-report="direction">Read report ↗</button></div>'+foot()+'</section>'}
function render(){document.querySelectorAll('[data-concept]').forEach(b=>{b.classList.toggle('active',b.dataset.concept===concept);b.setAttribute('aria-pressed',String(b.dataset.concept===concept))});document.getElementById('caption').innerHTML={launcher:'<strong>A / Search launcher.</strong> Type a plan, person, or report. Preview it, then act. A small window for fast jumps.',board:'<strong>B / Visual board.</strong> Group the work by what needs you, what is moving, and what is next. Reports and people stay visible.',agenda:'<strong>C / Compact agenda.</strong> A full-height shelf ordered around decisions and activity. Expand only the plan you need.'}[concept];const scene=document.getElementById('scene');scene.className='scene '+concept+'-scene';scene.innerHTML=os()+'<div class="desk-placeholder"></div><div class="desktop-copy"><div class="eyebrow">'+{launcher:'THE FASTEST WAY IN',board:'YOUR WORK, IN PERSPECTIVE',agenda:'LESS WINDOW. MORE AWARENESS.'}[concept]+'</div><h2>'+{launcher:'Find it. Go straight there.',board:'The bigger picture.',agenda:'A quiet shelf<br>for everything<br>in motion.'}[concept]+'</h2><p>'+{launcher:'Plans, reports, and people — one search away.',board:'Keep the moving pieces in view.',agenda:'Leave the rest of your desktop alone. See what needs you, read a report, or go straight to the person doing the work.'}[concept]+'</p></div>'+(dismissed?'<button class="dismissed" data-reopen><span class="brand">p</span>Open Quick Access <kbd class="key">Ctrl ⇧ Space</kbd></button>':{launcher,board,agenda}[concept]());const url=new URL(location.href);url.searchParams.set('concept',concept);history.replaceState(null,'',url)}
function renderSearch(){const input=document.activeElement,cursor=input?.selectionStart;render();const next=document.querySelector('.window input');next?.focus();if(next&&cursor!==null)next.setSelectionRange(cursor,cursor)}
function openDialog(html){document.getElementById('dialog-content').innerHTML=html;if(!dialog.open)dialog.showModal()}
function dialogHeader(title,extra=''){return '<header class="dialoghead"><span class="brand" style="width:22px;height:22px;font-size:18px">p</span><strong>'+title+'</strong><span class="grow"></span>'+extra+'<button class="iconbtn" data-close-dialog aria-label="Close detail">'+icon('close')+'</button></header>'}
function openPlan(id){const p=byPlan(id);openDialog(dialogHeader('Plan overview')+'<div class="dialogbody">'+badge(p)+'<h1>'+p.title+'</h1><p class="description">'+p.description+'</p><div class="row tiny mute" style="margin:20px 0 10px"><span>'+p.done+' of '+p.total+' tasks complete</span><span class="grow"></span><span>'+p.area+'</span></div>'+progress(p)+(p.note?'<div class="decision">'+icon('alert')+p.note+'</div>':'')+'<div class="sectionhead" style="padding:24px 0 5px">People on this plan</div>'+(p.agents.length?p.agents.map(id=>person(agents[id])).join(''):'<p class="empty">No agent assigned.</p>')+(p.reports.length?'<div class="sectionhead" style="padding:24px 0 5px">Reports</div>'+p.reports.map(reportLink).join(''):'')+'<p class="study-note">Illustrative plan · opens inside the separate popup.</p></div>')}
function openReport(id){const r=byReport(id),a=agents[r.author];openDialog(dialogHeader('Report reader',focus(a))+'<div class="dialogbody"><div class="eyebrow">'+r.kind+'</div><h1>'+r.title+'</h1><div class="reportmeta">'+avatar(a)+'<span>'+a.name+'</span><span>'+r.age+'</span><span class="grow"></span><button class="secondary" data-chat="'+a.id+'">'+icon('chat')+' Talk to author</button></div><article class="reportbody"><div class="callout">'+r.summary+'</div>'+r.sections.map(([h,p])=>'<h2>'+h+'</h2><p>'+p+'</p>').join('')+'</article><button class="secondary" style="margin-top:25px" data-plan="'+r.plan+'">'+icon('plan')+' Open linked plan</button><p class="study-note">Illustrative report · read here without opening the main app.</p></div>')}
function openChat(id){const a=agents[id],p=byPlan(a.plan),messages=messageStore.get(id)||[];openDialog(dialogHeader(a.name+' · Conversation',focus(a))+'<div class="dialogbody"><div class="row">'+avatar(a)+'<span><strong style="font-size:12px;font-weight:550">'+a.name+'</strong><span class="tiny mute" style="display:block">'+a.role+' · '+a.state+'</span></span><span class="grow"></span><span class="badge">'+p.title+'</span></div><div class="message user"><div class="by">You</div>Where are we on this plan?</div><div class="message"><div class="by">'+a.name+'</div><p>'+a.task+'. '+p.description+'</p><p style="margin-top:12px">You can read the latest report here, or use <strong>Focus window</strong> to jump to my separate working window.</p></div>'+messages.map(m=>'<div class="message user"><div class="by">You · local preview</div>'+esc(m)+'</div>').join('')+'<form class="compose" data-message-agent="'+id+'"><textarea aria-label="Message '+a.name+'" placeholder="Message '+a.name+' about '+p.title+'…"></textarea><div class="row"><span>To '+a.name+' · plan attached</span><span class="grow"></span><button class="primary" type="submit" aria-label="Send local message">'+icon('up')+' Send</button></div></form><p class="study-note">Local conversation preview. Nothing is sent to an agent.</p></div>')}
function focusWindow(id){const a=agents[id];if(a.state==='Ended'){toast('No live window for this ended session.');return}let win=previewWindows.get(id);if(!win||win.closed){const url=new URL('./index.html',location.href);url.searchParams.set('surface','agent');url.searchParams.set('agent',id);url.searchParams.set('plan',a.plan);win=window.open(url.href,'papercusp-agent-preview-'+id,'popup=yes,width=920,height=680');if(win)previewWindows.set(id,win)}if(win){win.focus();toast('Opened '+a.name+'’s window preview.')}else toast('Allow this local mockup to open the agent window preview.')}
let toastTimer;function toast(s){document.querySelector('.toast')?.remove();const t=document.createElement('div');t.className='toast';t.setAttribute('role','status');t.textContent=s;document.body.append(t);clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.remove(),3500)}
function setConcept(c){concept=c;query='';scope='All';selected='plan:interface';agendaArea='plans';dismissed=false;if(dialog.open)dialog.close();render()}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.concept){setConcept(b.dataset.concept);return}if(b.hasAttribute('data-dismiss')){dismissed=true;render();return}if(b.hasAttribute('data-reopen')){dismissed=false;render();return}if(b.hasAttribute('data-close-dialog')){dialog.close();return}if(b.dataset.scope){scope=b.dataset.scope;render();return}if(b.dataset.result){selected=b.dataset.result;if(innerWidth<=850){const [kind,id]=selected.split(':');if(kind==='report')openReport(id);else if(kind==='agent')openChat(id);else openPlan(id)}else{const scroll=document.getElementById('results').scrollTop;render();document.getElementById('results').scrollTop=scroll}return}if(b.dataset.plan){openPlan(b.dataset.plan);return}if(b.dataset.report){openReport(b.dataset.report);return}if(b.dataset.chat){openChat(b.dataset.chat);return}if(b.dataset.focus){focusWindow(b.dataset.focus);return}if(b.dataset.expand){agendaOpen=agendaOpen===b.dataset.expand?'':b.dataset.expand;const scroll=document.getElementById('agenda-content').scrollTop;render();document.getElementById('agenda-content').scrollTop=scroll;return}if(b.dataset.agenda){agendaArea=b.dataset.agenda;query='';render()}});
document.addEventListener('input',e=>{if(e.target.matches('.window input')){query=e.target.value;renderSearch()}});
document.addEventListener('submit',e=>{if(!e.target.matches('[data-message-agent]'))return;e.preventDefault();const id=e.target.dataset.messageAgent,value=e.target.querySelector('textarea').value.trim();if(!value)return;messageStore.set(id,[...(messageStore.get(id)||[]),value]);openChat(id);toast('Added locally. No message was sent.');dialog.querySelector('textarea').focus()});
document.addEventListener('keydown',e=>{const typing=/INPUT|TEXTAREA/.test(e.target.tagName);if(e.key==='Escape'&&!dialog.open){e.preventDefault();if(query){query='';render()}else{dismissed=!dismissed;render()}return}if(dialog.open)return;if(e.ctrlKey&&e.shiftKey&&e.code==='Space'){e.preventDefault();dismissed=!dismissed;render();return}if(!typing&&['a','b','c'].includes(e.key.toLowerCase())){setConcept({a:'launcher',b:'board',c:'agenda'}[e.key.toLowerCase()]);return}if(e.key==='/'&&!typing){e.preventDefault();document.querySelector('.window input')?.focus()}if(concept==='launcher'&&['ArrowDown','ArrowUp'].includes(e.key)){e.preventDefault();const rs=findResults();if(!rs.length)return;let i=rs.findIndex(r=>r.key===selected);i=(i+(e.key==='ArrowDown'?1:-1)+rs.length)%rs.length;selected=rs[i].key;const input=document.activeElement;render();if(input?.tagName==='INPUT')document.querySelector('.window input').focus();document.querySelector('.result.active')?.scrollIntoView({block:'nearest'});return}if(concept==='launcher'&&e.key==='Enter'&&!e.target.closest('button')){e.preventDefault();const r=findResults().find(r=>r.key===selected);if(!r)return;if(r.kind==='Reports')openReport(r.id);else if(r.kind==='Agents')openChat(r.id);else openPlan(r.id)}});
render();
</script>

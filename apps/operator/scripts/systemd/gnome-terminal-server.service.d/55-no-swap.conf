# WI-6554700010011963 [owner #1846 2026-10-14 "my system is frequently freezing"]:
# one gnome-terminal-server process renders EVERY terminal window on the desktop.
# It had 80% of its memory in swap (VmRSS 88 MB / VmSwap 367 MB), so typing into
# any terminal waited on swap-in from a saturated NVMe. This only covers the
# server process. The shells and agents running inside the terminals are in
# their own vte-spawn-*.scope cgroups and are NOT pinned.
[Service]
MemoryAccounting=yes
MemorySwapMax=0

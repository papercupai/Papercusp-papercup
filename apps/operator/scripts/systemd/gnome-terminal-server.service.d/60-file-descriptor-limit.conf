# WI-6554700010016095: GNOME Terminal saves the STARTUP soft limit, raises its
# own limit, and restores the saved limit in each atfork child before VTE opens
# the PTY peer. At 1029 inherited FDs, the saved 1024 limit caused EMFILE even
# though /proc/<server>/limits showed 1000000. Set both limits BEFORE startup.
# Install by symlink in ~/.config/systemd/user/gnome-terminal-server.service.d/.
# daemon-reload loads this for future starts. Do NOT restart the live server:
# that closes existing windows. New windows use gnome-terminal-safe.py instead.
[Service]
LimitNOFILE=1000000

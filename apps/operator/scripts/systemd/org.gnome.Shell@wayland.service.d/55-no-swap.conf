# WI-6554700010011963: the Wayland twin of org.gnome.Shell@x11.service.d/55-no-swap.conf.
# On Wayland gnome-shell is ALSO the display server, so a swapped-out shell freezes
# the whole screen. On an X11 host this unit is not loaded and the install guard
# reports it UNIT-ABSENT, which is expected there.
[Service]
MemoryAccounting=yes
MemorySwapMax=0

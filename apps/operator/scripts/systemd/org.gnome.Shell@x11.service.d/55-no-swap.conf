# WI-6554700010011963 [owner #1846 2026-10-14 "my system is frequently freezing"]:
# gnome-shell IS the compositor. Under host-wide memory pressure it had 82% of
# its memory in swap (VmRSS 315 MB / VmSwap 1.49 GB) and took ~140 major page
# faults per second while idle. Each fault is a synchronous read from the
# saturated swap NVMe, so every redraw, click or keypress could stall: the
# desktop "froze". Same mechanism and same fix as the pipewire audio dropouts
# (WI-10002460) and the MCP proxy (55-no-swap.conf, WI-10003355).
#
# MemorySwapMax=0 stops further swap-out of this cgroup's anonymous memory.
# memory.max stays "max", so no OOM can happen inside the cgroup. It applies
# LIVE on `systemctl --user daemon-reload`, with no restart.
[Service]
MemoryAccounting=yes
MemorySwapMax=0

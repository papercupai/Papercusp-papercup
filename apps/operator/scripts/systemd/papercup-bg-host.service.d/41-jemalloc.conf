# WI-10005291: run bg-host on jemalloc instead of glibc malloc, for bg-host ITSELF only.
#
# bg-host's resident memory was glibc keeping freed native memory, not live data. On pid
# 1496983 (2026-10-02 08:54Z, MALLOC_ARENA_MAX=2 already set) one malloc_trim(0) took VmRSS
# 12,132,104 -> 3,571,284 kB and the host stayed healthy (WI-10005291 comment 1155216).
# 40-malloc-arena.conf caps arenas but cannot return freed pages. The embed sidecar had the
# same retention and lost ~3.2 GB with jemalloc (papercup-embed-sidecar.service.d/45-jemalloc.conf).
#
# Same box, same node v25.9.0, synthetic Buffer churn holding 50 MB live (2026-10-02 15:5xZ,
# .papercusp/scratch/p6e9bd/alloc-probe.mjs): glibc arena=2 kept 364 MB resident after free;
# jemalloc decayed to 72 MB. Every native addon bg-host maps (rocksdb-native, sodium-native,
# better-sqlite3, sharp/libvips, node-pty) behaved the same under both allocators.
#
# bg-host spawns many children (git, agent CLIs, the spawner sidecar). PAPERCUSP_ALLOCATOR_
# PRELOAD_SCOPE=self makes apps/operator/bin/boot-malloc-arena.ts remove LD_PRELOAD and
# MALLOC_CONF from its own environment at boot, after ld.so and jemalloc have read them, so
# children start on glibc. Its journal line says whether jemalloc is actually mapped:
#   [boot-malloc-arena] self-only allocator preload: jemalloc active in pid <pid>; ...
#
# Needs the libjemalloc2 package (Ubuntu: apt install libjemalloc2). If the library is missing,
# ld.so logs "cannot be preloaded: ignored", the line above says "NOT loaded", and bg-host runs
# on glibc as before. Reversible: remove the symlink in
# ~/.config/systemd/user/papercusp-bg-host.service.d/ and daemon-reload.
[Service]
Environment=LD_PRELOAD=/usr/lib/x86_64-linux-gnu/libjemalloc.so.2
Environment=MALLOC_CONF=background_thread:true,narenas:4
Environment=PAPERCUSP_ALLOCATOR_PRELOAD_SCOPE=self

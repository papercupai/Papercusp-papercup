# papercup-bg-host.service.d/95-bundled-entry.conf
#
# Build the plain-Node host bundle immediately before every bg-host start. The
# base unit's npx/tsx entry reads the shared checkout directly, so a lazy import
# can cache a half-written module after a multi-file edit and keep the broken
# behavior alive until the next restart.
#
# ExecStart is a list-valued systemd setting: the empty assignment below clears
# the base command before installing the bundled entry. The replacement repeats
# the base unit's inline environment because those assignments lived inside its
# bash command rather than in Environment= directives. A bare `node` command
# would otherwise silently lose the port, DBOS, and routine-engine settings.
[Service]
# TimeoutStartSec — REQUIRED companion to the ExecStartPre below. Do NOT install this
# drop-in without it (plan substrate-observability-bug-wave-2026-08-26, D-003).
#
# ExecStartPre time counts against TimeoutStartSec for Type=simple, and the base unit
# inherits systemd's 90s default with nothing raising it. MEASURED 2026-08-26: the bundle
# takes 36.61s warm on an unloaded box — so 90s does fit, with ~2.5x margin. That margin
# is the problem, not the fit: this host was observed at load 421 (128 cores) the same day,
# with a measured cadence knee at ~230 load where a 60s interval degraded to 97.5s. A 2.5x
# margin does not survive that, and losing the race is not graceful — systemd SIGTERMs the
# start job, and Restart=always (drop-in 40) + RestartSec=5 + RestartSteps=0 then retries
# the same losing boot ~5x per incident, taking DBOS routines, git-sync and the
# green-checkpoint gate with it.
#
# 300s = ~8x the measured bundle, matching papercup-embed-sidecar.service and
# papercup-testvm-reaper.service. Before this line, bg-host was the only long-running unit
# in scripts/systemd/ that set no TimeoutStartSec at all.
#
# NOTE the 36.61s figure is a FLOOR, not a worst case: n=1, warm page cache, box not at
# peak load. A cold-cache build under load has not been measured. Do not lower this value
# on the strength of that number.
TimeoutStartSec=300
# EI-19457229906581679: declare that THIS caller is a SUPERVISOR, not a release.
# bundle-host.sh exits 1 on a failed bundle by default — correct for deploy-cli
# (WI-41242: stale bytes must not be reported as a green release) and wrong here,
# where a non-zero ExecStartPre means the unit never starts and Restart=always
# re-bundles the same broken shared tree every RestartSec. This unit hosts
# git-sync, the DBOS routine engine and the green-checkpoint gate, so a boot
# refused over a transient syntax error in someone else's half-finished edit
# takes the fleet's commit and gate cadence down with it. Boot last-known-good
# instead — loudly: the journal carries the FALLING BACK / STALE CODE banner and
# /api/health reports bundleStale. Starting with NO bundle at all is still
# refused; the opt-in does not reach that branch.
Environment=PAPERCUSP_BUNDLE_ALLOW_STALE_START=1
# PgBouncer transaction-pools the org clients, so their per-process slot count
# should follow the resource profile. An explicit PAPERCUSP_DB_POOL_MAX pin here
# starves bg-host locally before PgBouncer reaches its backend ceiling.
# %h (systemd's user-home specifier), NOT a hardcoded /home/<user>/ path: this is shipped
# source, and a build-box literal here trips the identity-lint leg of green-checkpoint and
# freezes main for the whole fleet. Both scripts/check-no-box-identity.mjs and
# scripts/check-no-identity-literals.mjs flagged this line before this change. %h is already
# the convention in this directory — see llm-test-nightly.service and marketplace-api.service.
# WI-10006398: run bundle-host.sh from a frozen snapshot (papercusp-script-snapshot.sh), so an
# edit landing during its multi-minute build cannot change the program bash is reading lazily.
# From the snapshot it cannot locate the checkout by its own path, so the checkout is pinned
# here. bundle-host.sh honours this value ONLY when it runs from a snapshot: this Environment=
# also reaches every process bg-host spawns (deploy-cli runs papercup-release's copy in place),
# and an in-place run discards it rather than bundle the staging tree into a release.
Environment=BUNDLE_HOST_OPERATOR_DIR=%h/papercupai-workspace/papercusp/apps/operator
ExecStartPre=%h/papercupai-workspace/papercusp/apps/operator/scripts/systemd/papercusp-script-snapshot.sh %h/papercupai-workspace/papercusp/apps/operator/bin/bundle-host.sh
ExecStart=
# The `unset GOOGLE_APPLICATION_CREDENTIALS` below is DELIBERATE — do not simply restore it.
# Workspace-host provisioning refuses service-account keys outright (gcp-preflight.ts), and this
# box exports a box-wide ADC path that points at one (environment.d/55-vertex-ai.conf →
# vertex-sa.json, type: service_account). With ADC set, every provision attempt resolves to a
# banned principal and dies on `GCP ADC/Compute validation failed`, so the unset is what lets the
# permitted human/compute chain be reached at all.
#
# But this unit is ALSO the DBOS routines primary (PAPERCUSP_DBOS_ROUTINES=1 below), and that is
# where the Gmail sync runs (originally the `google-gmail-poll` routine; since 2026-10-06 the
# `gmail` provider plugin under `system:connector-sync`, whose Pub/Sub push wake resolves this key
# by reference through integrations/service-credentials.ts). That Pub/Sub layer needs a key file,
# and clearing ADC took the only path it knew — so both Gmail trigger sources sat degraded on
# `google_pubsub_service_account_path_required` for days while the topic, its
# gmail-api-push publisher binding and the workspace pull subscription were ALL already
# provisioned. Hardening one subsystem silently stranded the other (WI-474688, 2026-08-28).
#
# Hand the key to the Pub/Sub layer explicitly BEFORE clearing ADC. `$$` is systemd's literal
# dollar; the assignment is identity-free (no box path) and keeps an explicit .env.local override
# winning, so it stays correct on a box that exports a different ADC or none at all.
ExecStart=/usr/bin/bash -c "set -a; [ -f .env.local ] && . ./.env.local; PAPERCUSP_GOOGLE_PUBSUB_SERVICE_ACCOUNT_PATH=$${PAPERCUSP_GOOGLE_PUBSUB_SERVICE_ACCOUNT_PATH:-$$GOOGLE_APPLICATION_CREDENTIALS}; unset GOOGLE_APPLICATION_CREDENTIALS; set +a; exec env \
  PAPERCUSP_HONO_PORT=3271 \
  PAPERCUSP_BIND_HOST=127.0.0.1 \
  PAPERCUSP_BACKGROUND_WORKERS=1 \
  PAPERCUSP_DBOS_ENABLE=1 \
  PAPERCUSP_DBOS_ORCHESTRATOR=1 \
  PAPERCUSP_DBOS_ROUTINES=1 \
  PAPERCUSP_DBOS_TIMERS=1 \
  PAPERCUSP_DBOS_AUTOLOOP=0 \
  DB_IDLE_TIMEOUT=10 \
  PAPERCUSP_EXPECTED_OPERATOR_PROCS=6 \
  DBOS__VMID=bg-host-3270 \
  DBOS__APPVERSION=bg-host-v1 \
  node dist-host/hono-host.mjs"

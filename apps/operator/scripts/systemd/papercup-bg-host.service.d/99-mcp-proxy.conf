[Service]
# Give :3271's own MCP clients a stable endpoint, while the explicit target pin
# keeps every request on the same background-host code and tool catalog.
# Orchestrator/blueprint spawns (release fixers and other gate-repair roles) use
# this pin, so they stay on bg-host's current build (WI-212675).
Environment=PAPERCUSP_MCP_PROXY_BASE=http://127.0.0.1:9271
Environment=PAPERCUSP_MCP_PROXY_TARGET_PORT=3271
# WI-6554700010008332 (owner decision 2026-10-11, "Move all to :3070"): the SU
# sessions, resumes and console-launched agents (goal, consult, fleet) that bg-host
# starts connect through the live proxy instead. On bg-host their turn-end hook ran
# at p50 ~9s vs ~149ms on :3070 and starved the goal turn-end recorder. Remove this
# line to put them back on bg-host's own vintage.
Environment=PAPERCUSP_BG_HOST_AGENTS_MCP_BASE=http://127.0.0.1:9071

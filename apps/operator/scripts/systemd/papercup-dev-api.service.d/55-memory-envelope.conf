# EI-20340243384897336 / operator-memory-and-psu-resilience-2026-06-14 D-021.
#
# papercup-dev-api used to be a 17-process Node cluster on the shared development host.
# PAPERCUSP_MEMORY_WATCHDOG_LIMIT_MB is process-scoped, so the former 12 GiB
# service override multiplied into roughly 204 GiB of aggregate headroom and
# could not bound the cgroup. Return request workers to the role-aware watchdog
# default, then enforce one reclaim-first envelope over the whole service.
#
# EI-21203816636342220: sixteen request workers can each reach the role-aware
# 3200 MiB recycle ceiling while the background primary can reach 12288 MiB.
# Their 63488 MiB aggregate budget is already near MemoryMax and well above
# MemoryHigh; live pressure reproduced at 46.88 GiB + 5.19 GiB swap with 28,572
# memory.high events. Cap the request tier at six via CLUSTER_WORKERS (the
# resolver's documented precedence over the legacy CLUSTER=16 drop-in):
# 6*3200 + 12288 = 31488 MiB, leaving 17664 MiB below the 48 GiB reclaim line.
# The lower cap is deliberate: the 2026-08-25 OOM incident killed the service
# at a 31.1 GiB peak while PostgreSQL and the fleet were consuming the rest of
# host memory; the prior ten-worker ceiling was safe only for the earlier load.
# EXPECTED_OPERATOR_PROCS follows the actual six workers + one primary so PG
# pool sizing remains conservative without pretending the retired workers exist.
#
# WI-6554700010029423 [owner 2026-10-26] - TEMPORARY MITIGATION, request workers 6 -> 9.
# Measured 12:00-12:40Z: the six request workers each sat at 2.4-3.0 GB and were
# SIGKILLed 15x in 4h (13 memory-watchdog >=3200 MiB recycles + 2 event-loop
# WEDGED kills); every kill dropped all MCP/SSE connections on that worker (the
# fleet-wide "reconnecting"), and each worker shed tools/call with 429
# loop_pressure_critical beforehand (the "slowness"). The per-worker load is
# concurrent 25k-row coord:inbox decodes on the stale :3070 build; spreading the
# same request rate over nine workers lowers per-worker concurrency and heap.
# Envelope: 9*3200 + 12288 = 41088 MiB worst case (< 48 GiB reclaim line);
# at change time the cgroup used 14.0 GiB (peak 34.3 GiB, zero memory.high
# events) with 108 GiB host memory available.
# DURABLE FIX = ship current staging to :3070 (coord:inbox already pages via
# readInboxWindow there) plus the broadcast read horizon on that item. Revert to
# six once :3070 runs a build carrying those fixes.
#
# MemoryHigh throttles/reclaims; MemoryMax is the last-resort hard ceiling, not
# the steady-state target.
#
# WI-10003355 [owner #664 2026-09-26 "operator very laggy"]: MemorySwapMax=0.
# The request workers serve interactive UI/MCP traffic, so their heap must stay
# in RAM. With a 16G swap allowance, host-wide pressure from batch jobs (kopia
# page cache, bulk copies) pushed 225-407 MB of each worker's heap to swap on
# nvme1n1 (w_await >100 ms under load); V8 GC then walked swapped pages and the
# event loop stalled up to 4.5 s. The two slowest /api/health probes (882 ms,
# 1005 ms) landed in the same seconds as 603 and 642 major faults/s in this
# cgroup. The watchdog-bounded working set (6x3200 + 12288 MiB, above) sits
# far below MemoryHigh, so swap never held capacity this service needed. Same
# policy as postgresql@18-main and papercusp-bg-host.
[Service]
UnsetEnvironment=PAPERCUSP_MEMORY_WATCHDOG_LIMIT_MB
Environment=PAPERCUSP_CLUSTER_WORKERS=9
Environment=PAPERCUSP_EXPECTED_OPERATOR_PROCS=10
MemoryAccounting=yes
MemoryHigh=48G
MemoryMax=64G
MemorySwapMax=0

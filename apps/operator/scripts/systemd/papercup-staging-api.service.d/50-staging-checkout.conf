# Isolated staging tier: :3170 serves the committed staging generation selected
# through the stable papercusp-staging.current alias. Keep this and
# 95-bundled-entry.conf on that same alias; sync-staging-checkout.sh refuses a
# split configuration.
# %h is systemd's user-home specifier, never a box-identity literal.
#
# PAPERCUSP_INTEGRATION_ROOT starts at the stable alias. ExecStart resolves it
# to the physical generation after loading .env.local so runtime readers keep
# using the generation this process started from.
# PAPERCUSP_CANONICAL_TREE names the tree agents EDIT. They differ only on this
# host, and a reader that treats the first as the second answers every working-tree
# question about the clean mirror: dev:pipeline_position reported an uncommitted
# edit as clean and live (EI-24049239243821100).
[Service]
WorkingDirectory=%h/papercupai-workspace/papercusp-staging.current/apps/operator
# Keep the canonical runtime pin available even when an ignored .env.local was
# absent from a published generation. ExecStart still sources that generation's
# local file afterward, preserving intentional staging overrides.
EnvironmentFile=-%h/papercupai-workspace/papercusp/apps/operator/.env.local
Environment=PAPERCUSP_INTEGRATION_ROOT=%h/papercupai-workspace/papercusp-staging.current
Environment=PAPERCUSP_SPA_DIST=%h/papercupai-workspace/papercusp-staging.current/apps/operator-vite/dist
Environment=PAPERCUSP_CANONICAL_TREE=%h/papercupai-workspace/papercusp
# This managed tier shares the configured operator database. A desktop's mutable
# embedded-PG discovery file must not redirect its boot preflight or real data.
# Explicit database URL / PG-port configuration still takes precedence.
Environment=PAPERCUSP_SKIP_PG_DISCOVERY=1

# Match the hosted control-plane's maintained chat route. Native Codex and
# Claude children inherit this unpinned pool route; provider credentials and
# usage holds remain in the inference gateway. This sentinel is not a secret.
# Install as a symlink with the other tracked drop-ins, then daemon-reload.
[Service]
Environment=PAPERCUSP_CODEX_GATEWAY=1
Environment=ANTHROPIC_BASE_URL=http://127.0.0.1:8788
Environment=ANTHROPIC_AUTH_TOKEN=papercusp-gateway
Environment=PAPERCUSP_ACCOUNT_ROUTING_MODE=auto

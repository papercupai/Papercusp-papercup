# Build the :3170 plain-Node host from the isolated committed staging checkout.
# sync-staging-checkout.sh prebuilds this graph while the old generation still
# serves; ExecStartPre reuses it only when bundle-host-freshness.mjs proves the
# checkout HEAD, tracked cleanliness, entry and whole dist-host tree unchanged.
# Any drift falls back to bundle-host.sh's ordinary full rebuild.
[Service]
# Keep the unit activating until hono-host has bound the request listener and
# sent READY=1 from its actual listening callback.
Type=notify
NotifyAccess=all
Environment=PAPERCUSP_BUNDLE_REUSE_FRESH=1
# Keep server-generated staging MCP configs on the resilient proxy that forwards only to :3170.
Environment=PAPERCUSP_MCP_STAGING_PROXY_PORT=9171
# Keep clients launched by staging aligned with its bounded same-build proxy retry window.
Environment=PAPERCUSP_MCP_PROXY_RETRY_MS=300000
# Share staging-sync's checkout lock for the entire bundle read. Its exclusive
# phase materializes submodules in place; bundling before that phase ends can
# read missing files and boot a stale fallback bundle.
#
# This drop-in is symlinked live from the canonical tree, but the helper below
# is read from papercusp-staging.current, which lags the tree by one staging
# generation. A generation that predates the helper must still boot (WI-10005259:
# a hard reference crash-looped :3170 fleet-wide), so ExecStartPre falls back to
# the plain shared flock, and ExecStartPost is best-effort ('-'): attribution is
# diagnostics only and must never alter lock or readiness behavior.
ExecStartPre=/usr/bin/bash -c 'root="%h/papercupai-workspace/papercusp-staging.current"; helper="$$root/apps/operator/scripts/systemd/staging-lock-attribution.sh"; if [ -f "$$helper" ]; then exec /usr/bin/bash "$$helper" api-pre /tmp/papercup-staging-sync.lock "$$root/apps/operator/bin/bundle-host.sh"; fi; echo "[95-bundled-entry] $$helper is absent from this staging generation; bundling under the shared flock without attribution" >&2; exec /usr/bin/flock -s /tmp/papercup-staging-sync.lock "$$root/apps/operator/bin/bundle-host.sh"'
ExecStartPost=-/usr/bin/bash %h/papercupai-workspace/papercusp-staging.current/apps/operator/scripts/systemd/staging-lock-attribution.sh api-post papercup-staging-api.service
ExecStart=
ExecStart=/usr/bin/bash -c 'set -a; [ -f .env.local ] && . ./.env.local; set +a; export PAPERCUSP_INTEGRATION_ROOT="$(cd ../.. && pwd -P)" PAPERCUSP_HONO_PORT=3170 PAPERCUSP_PTY_WS_PORT=3156 MOBILE_VOICE_WS_PORT=3168 PAPERCUSP_BIND_HOST=127.0.0.1; exec node dist-host/hono-host.mjs'

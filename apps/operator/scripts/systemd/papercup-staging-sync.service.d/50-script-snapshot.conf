# A build can run for minutes while agents edit the canonical shell source.
# Freeze each invocation with the existing shared script-snapshot launcher.
# The base unit's PAPERCUSP_INTEGRATION_ROOT remains the canonical source root;
# do not resolve it relative to the temporary script snapshot.
[Service]
# Migration lint and candidate schema preparation must select the same managed
# database as the staging API, even when desktop discovery points elsewhere.
# Explicit database configuration still takes precedence in the shared resolver.
Environment=PAPERCUSP_SKIP_PG_DISCOVERY=1
# EI-25898717052240161: run the script as COMMITTED on staging, the lineage this unit
# deploys. Running the working-tree copy let an uncommitted edit import an export the
# candidate checkout lacked, failing every run for 2.5 h (2026-10-13).
Environment=PAPERCUSP_SCRIPT_SNAPSHOT_GIT_REF=staging
# Worker execution starts after exec; preparation uses independent finite
# command deadlines. EXTEND_TIMEOUT_USEC is lost across systemd 255 reloads.
Type=exec
TimeoutStartSec=15min
# Aggregate backstop for lock acquisition, cleanup and coordinated restart.
# Individual preparation commands remain limited to 15 minutes each.
RuntimeMaxSec=90min
ExecStart=
ExecStart=/usr/bin/bash %h/papercupai-workspace/papercusp/apps/operator/scripts/systemd/papercusp-script-snapshot.sh %h/papercupai-workspace/papercusp/apps/operator/bin/release/sync-staging-checkout.sh

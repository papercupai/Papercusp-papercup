# papercusp-server.service.d/97-gateway-systemd-authority.conf
#
# On the shared Linux development host, papercusp-server.service can run beside
# the dedicated papercup-inference-gateway.service. Keep the dedicated unit the
# single :8788 authority by disabling this process's cross-platform fallback.
#
# This is a host-only override, not part of the packaged unit: Linux installs
# without the dedicated gateway keep the default-on managed fallback.
[Service]
Environment=PAPERCUSP_GATEWAY_SUPERVISE=0

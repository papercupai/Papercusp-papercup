# USER slice drop-in — install as a symlink:
#   mkdir -p ~/.config/systemd/user/papercusp.slice.d \
#   && ln -sfn "$PWD/apps/operator/scripts/systemd/papercusp.slice.d/60-background-cpu-weight.conf" \
#        ~/.config/systemd/user/papercusp.slice.d/60-background-cpu-weight.conf \
#   && systemctl --user daemon-reload
# CPUWeight applies live; nothing restarts. scripts/check-systemd-dropins-installed.mjs verifies it.
#
# papercusp-performance-audit-2026-10-12 R-3 / WI-6554700010010449 — the serving path must
# outweigh background work under CPU contention. cgroup v2 compares cpu.weight only between
# SIBLINGS. In the user manager (user@1000.service) the siblings are:
#   app.slice        100  release operator (papercusp-dev-api, CPUWeight 2000), bg-host (2000),
#                         mcp-proxy, inference-gateway, plus GNOME terminals and desktop apps
#   papercusp.slice  100  ALL task-manager work: headless agents, bash jobs, builds, test runs,
#                         LSP/tsserver sidecars, Xvfb verification
#   session.slice    100  the GNOME session
#   background.slice  30
# At 100/100 the serving units got an EQUAL share with papercusp.slice, so the 2000 weights on
# the serving units only won against their app.slice siblings (outside review thread-post:1178953).
# 25 gives app.slice four shares to papercusp.slice's one. Lowering papercusp.slice instead of
# raising app.slice keeps the desktop (session.slice) at parity with app.slice.
#
# Weights are work-conserving: when cores are idle papercusp.slice still gets all of them. They
# only bind under saturation (CPU PSI some was 1.7-8% during the audit). Nothing on the serving
# path runs in papercusp.slice (measured 2026-10-13 14:45Z).
[Slice]
CPUWeight=25

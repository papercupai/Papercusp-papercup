# WI-6554700010011963 [owner #1846 2026-10-14 "my system is frequently freezing"]:
# a prefix drop-in that applies to every logind session scope (session-<N>.scope).
# The graphical login session holds Xorg plus gdm-x-session and gnome-session-binary,
# about 300 MB in total. Xorg had 81% of its memory in swap (51 MB RSS / 224 MB
# swap); on X11 a stalled X server freezes every window. The session number
# changes at each login, so only a prefix drop-in survives a re-login.
#
# Install as a root-owned copy, never a symlink into $HOME (the system manager
# must not load config a user can rewrite):
#   sudo install -D -m0644 <this file> /etc/systemd/system/session-.scope.d/55-no-swap.conf
#   sudo systemctl daemon-reload
# The change applies live with no logout. An SSH login also gets a session scope,
# so its shells would not swap either. memory.max stays "max", so nothing can
# be OOM-killed inside the scope because of this.
[Scope]
MemoryAccounting=yes
MemorySwapMax=0

# SYSTEM slice drop-in — install to /etc/systemd/system/system-postgresql.slice.d/
# (sudo install -D -m0644 <this file> /etc/systemd/system/system-postgresql.slice.d/60-papercusp-serving-cpu-weight.conf
#  && sudo systemctl daemon-reload — CPUWeight applies live, no PostgreSQL restart).
#
# papercusp-performance-audit-2026-10-12 P-008 / WI-6554700010009308 — protect the serving
# database's CPU. cgroup v2 compares cpu.weight only between SIBLINGS. PostgreSQL's slice is a
# sibling of every docker-<id>.scope in system.slice (97 test containers on 2026-10-13, and the
# audit saw one benchmark container use ~51 of 128 cores), all at the default weight 100. Under
# saturation PostgreSQL would get one equal share among whichever containers are runnable.
# 1000 gives it ten shares. CPUWeight only matters when cores are saturated; it costs nothing
# when they are not (CPU PSI some was 1.7-2.8% during the audit).
#
# The user-side serving units (papercusp-dev-api, papercusp-bg-host) run at CPUWeight=2000
# inside app.slice. app.slice and papercusp.slice (all agent, test, build and bash-job work)
# were equal at 100, so the serving units did NOT outweigh that work (outside review
# thread-post:1178953). papercusp.slice now runs at CPUWeight=25: see the user drop-in
# apps/operator/scripts/systemd/papercusp.slice.d/60-background-cpu-weight.conf (WI-6554700010010449).
[Slice]
CPUWeight=1000

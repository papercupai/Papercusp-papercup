function jobs(){return header('Human expertise, where it helps','Real tasks, clear budgets and accountable acceptance.',act('Post a job','post-job'),'Human jobs')+tabs(['Open jobs','Applications','Active contracts','Retainers'])+'<div class="split"><div class="card">'+[['Independent security reviewer','$2,000','Fixed project · 2 weeks'],['Community designer','$1,600','Milestone-based · 1 week'],['Designated human: finance','$900 / month','Retainer · 3 months']].map(x=>'<div class="row"><span class="symbol">'+icon('users')+'</span><div><h3>'+x[0]+'</h3><p>'+x[2]+'</p></div><div class="row-tail"><strong>'+x[1]+'</strong><br><button class="text-button" data-act="apply">Apply</button></div></div>').join('')+'</div><div class="card"><h3>A clear path to payment</h3>'+['Agree on scope & budget','Fund the work','Submit evidence','Review & release payout'].map((x,i)=>'<div class="step"><span class="step-num">'+(i+1)+'</span><div><h3>'+x+'</h3></div></div>').join('')+'<div class="notice">Disputes and refunds stay attached to the job and acceptance terms.</div></div></div>'}
function records(){return header('Trust you can inspect','Decisions, reports and financial evidence in one record.',act('Export records','export','secondary'),'Transparency')+tabs(['Reports','Decisions','Charter & rules','Journal','Verification'])+'<div class="stats">'+stat('Latest statement','September','Signed · published Oct 3')+stat('Reconciliation','Matched','Sample data · refreshed today')+stat('Proposal records','42','Revision & vote history')+stat('Security review','In progress','Scope & limits published')+'</div><div class="split"><div class="card"><h2>Public records</h2><div class="mt">'+table(['Record','Period','State',''],[['Treasury statement','Sep 2026',pill('Signed','good'),'<button class="text-button" data-act="report">Read</button>'],['Governance charter','Revision 3',pill('Ratified','good'),'<button class="text-button" data-act="charter">Read</button>'],['Inference approval','AC-042',pill('Voting','accent'),'<button class="text-button" data-route="vote">View</button>'],['Voting & P2P security scope','Oct 2026',pill('Review open','warn'),'<button class="text-button" data-act="security">Scope</button>']])+'</div></div><div class="card"><h3>What’s verifiable</h3>'+['Exact proposal & policy revisions','Counted ballots and approval rules','Receipt inclusion and ledger anchors','Transactions and reconciliation'].map(x=>'<div class="checks"><span>✓</span>'+x+'</div>').join('')+'<div class="notice mt">Published evidence is not a whole-system security guarantee. Private records retain access controls.</div></div></div>'}
function settings(){return header('Shape how your DAO works','Create an organization or update its rules through the right approvals.',act('Create a new DAO','create'),'Administration')+'<div class="card settings"><nav class="subnav" aria-label="Settings sections">'+['Organization profile','Membership','Governance','Treasury & signers','Issuer & ownership','Safety & permissions'].map((x,i)=>'<button data-settings="'+x+'" class="'+(!i?'active':'')+'">'+x+'</button>').join('')+'</nav><div><h2 id="settings-title">Organization profile</h2><div class="grid two"><div class="field"><label for="dao-name">DAO name</label><input id="dao-name" class="input" value="Atlas Commons"></div><div class="field"><label for="visibility">Visibility</label><select id="visibility" class="input"><option>Public — visible in directory</option><option>Invite-only</option></select></div></div><div class="field"><label for="mission">Mission</label><textarea id="mission" rows="3" class="input">Open infrastructure, built and owned together.</textarea></div><div class="grid two"><div class="field"><label for="admission">Admission</label><select id="admission" class="input"><option>Open membership</option><option>Application & approval</option><option>Allowlist / invitation</option></select></div><div class="field"><label for="rule">Plan voting</label><select id="rule" class="input"><option>One member, one vote</option><option>Explicit policy-defined weights</option></select></div></div><div class="notice">Profile edits can be saved by an editor. Governance changes require ratification under the current policy.</div><div class="mt">'+act('Preview changes','save')+'</div></div></div>'}
function inbox(){return header('Your communities, your next moves','The things that need you, across all your DAOs.',btn('Discover another DAO','directory','secondary'),'My DAOs')+'<div class="grid three">'+[['a','Atlas Commons','Contributor','2 votes · 1 reward'],['f','Fieldnotes Collective','Member','1 project review'],['o','Open Studio','Contributor','1 invitation']].map(x=>'<button class="card" style="text-align:left" data-route="overview"><div class="flex mb"><span class="mini-logo">'+x[0]+'</span><h3>'+x[1]+'</h3></div><p class="tiny muted">'+x[2]+'</p><div class="mt">'+pill(x[3],'accent')+'</div></button>').join('')+'</div><div class="split mt"><div class="card"><div class="card-head"><h2>Your action inbox</h2>'+pill('5 actions','accent')+'</div>'+[['vote','Vote on the inference commons','Atlas · ends in 2 days','Vote','vote'],['gift','Claim your accepted contribution','Atlas · $1,250 available','Review','funding'],['work','Review a research milestone','Fieldnotes · evidence attached','Open','work'],['chart','Claim your share return','Atlas · 625 shares','Claim','returns'],['users','Complete studio membership','Open Studio · invitation','Continue','join']].map(x=>'<div class="row"><span class="symbol">'+icon(x[0])+'</span><div><h3>'+x[1]+'</h3><p>'+x[2]+'</p></div><button class="text-button" style="margin-left:auto" data-route="'+x[4]+'">'+x[3]+icon('arrow',true)+'</button></div>').join('')+'</div><div class="card"><h3>Keep the signal useful</h3><p class="tiny muted mt">Choose which votes, tasks, signatures and announcements reach you.</p><div class="divider"></div><label class="terms"><input type="checkbox" checked>Votes ending soon</label><label class="terms"><input type="checkbox" checked>Accepted work & rewards</label><label class="terms"><input type="checkbox">Announcements</label></div></div>'}
const views={directory,overview,join,members,proposals,vote,delegation,work,treasury,funding,reputation,ownership,returns,marketplace,billing,jobs,records,settings,inbox};
function render(){const app=document.getElementById('app'),wide=state.concept==='commons'&&['directory','inbox','join'].includes(state.screen);app.className=state.concept+(wide?' wide':'');document.querySelectorAll('[data-concept]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.concept===state.concept)));document.getElementById('note').textContent=concepts[state.concept].note;document.getElementById('jump').innerHTML=Object.entries(screens).map(([k,v])=>'<option value="'+k+'"'+(k===state.screen?' selected':'')+'>'+v+'</option>').join('');app.innerHTML=top()+'<div class="workspace">'+(wide?'':sidebar())+'<main class="main"><div class="crumbs"><span>'+(['directory','inbox'].includes(state.screen)?'Papercusp':'Atlas Commons')+'</span><span>/</span><span>'+screens[state.screen]+'</span>'+(state.concept!=='commons'?'<span class="demo">Concept · sample data</span>':'')+'</div>'+views[state.screen]()+'<p class="footer">Interactive concept · fictional data · no real votes, payments or wallet connections</p></main></div>';const u=new URL(location.href);u.searchParams.set('concept',state.concept);u.searchParams.set('screen',state.screen);history.replaceState(null,'',u);document.title=concepts[state.concept].name+' · '+screens[state.screen]+' · Papercusp'}
function navigate(s){if(screens[s]){state.screen=s;render();window.scrollTo(0,0)}}
function toast(s){const t=document.getElementById('toast');t.textContent=s;t.hidden=false;clearTimeout(window.toastTimer);window.toastTimer=setTimeout(()=>t.hidden=true,4500)}
function modal(title,copy,fields,label){document.getElementById('dialog-body').innerHTML='<h2 id="dialog-title">'+title+'</h2><p>'+copy+'</p>'+(fields||'')+'<div class="mt">'+act(label||'Done','dialog-done','wide')+'</div>';const d=document.getElementById('dialog');d.setAttribute('aria-labelledby','dialog-title');d.showModal()}
function perform(key){if(key==='vote'){state.voted=true;render();toast('Preview ballot recorded. No real vote was submitted.');return}if(key==='join'){if(!document.getElementById('terms').checked){toast('Accept the sample agreement to continue.');return}state.joined=true;render();toast('Preview membership active. No real DAO was joined.');return}if(key==='dialog-done'){document.getElementById('dialog').close();toast('Preview saved. No external action was taken.');return}if(key==='new-proposal'){modal('Start a proposal','Connect an idea, a bounded budget and evidence of success.','<div class="field"><label for="proposal-title">Title</label><input id="proposal-title" class="input" placeholder="What should we build or change?"></div><div class="field"><label for="outcome">Outcome & acceptance</label><textarea id="outcome" class="input" rows="3" placeholder="What demonstrates success?"></textarea></div>','Save preview draft');return}if(['claim','share-claim','bonus-claim','equity-vote','transfer','fund'].includes(key)){modal('Review before signing','A real flow verifies the exact network, recipient, asset and action before requesting your wallet signature.',kv('Network','Base testnet · sample')+kv('Action',{claim:'Claim $1,250 reward','share-claim':'Claim 2,400 earned shares','bonus-claim':'Claim 625 bonus shares','equity-vote':'Ownership proposal ballot',transfer:'Eligible ownership transfer',fund:'Add prepaid credits'}[key])+kv('Wallet','0x72b…a019 · sample')+'<div class="notice mt">No wallet will be connected. No transaction will be sent.</div>','Confirm preview');return}if(key==='create'){modal('Create your DAO','Start with a clear mission and membership policy.','<div class="field"><label for="new-dao">Name</label><input id="new-dao" class="input" placeholder="Your community"></div><div class="field"><label for="new-policy">Admission</label><select id="new-policy" class="input"><option>Open</option><option>Approval</option><option>Invitation only</option></select></div>','Create preview DAO');return}const info={terms:['Issuer & ownership terms','Read the issuer agreement, rights, eligibility and register recognition before accepting ownership.'],recovery:['Consented wallet recovery','Requires the old wallet or a previously designated recovery agent, plus acceptance by the new wallet.'],invite:['Invite a member','The invitation states access. Admission and voting eligibility remain separate.'],delegate:['Review delegation','A real delegation includes a representative, scope, expiry and revocation.'],install:['Review release & permissions','Inspect the signed release, dependencies, permissions and price before installing.'],publish:['Publish a release','Prepare an immutable release, listing, permissions, pricing and review state.'],apply:['Apply for funding or work','Describe your approach, budget, milestones and evidence of success.'],report:['Transparency statement','Revenue, allocations, reconciliation and verification evidence are linked.'],charter:['Community charter','Members vote on exact revisions. Rule changes use the previous policy.'],security:['Security review scope','Voting authentication, P2P boundaries and exact treasury execution remain an explicit review scope.'],wallet:['Manage your wallet','Wallet binding, membership and ownership remain distinct.']};if(info[key])modal(...info[key]);else toast('Preview: '+key.replace(/-/g,' ')+'. No real action was taken.')}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b)return;if(b.dataset.concept){state.concept=b.dataset.concept;state.screen=concepts[state.concept].initial;render();window.scrollTo(0,0)}else if(b.dataset.route)navigate(b.dataset.route);else if(b.dataset.act)perform(b.dataset.act);else if(b.dataset.vote){state.vote=b.dataset.vote;render()}else if(b.dataset.filter){state.category=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));filter()}else if(b.dataset.tab){b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));toast('Preview tab: '+b.dataset.tab+'. Key screen content is shown below.')}else if(b.dataset.settings){document.getElementById('settings-title').textContent=b.dataset.settings;b.parentElement.querySelectorAll('button').forEach(x=>x.classList.toggle('active',x===b));toast('Preview settings: '+b.dataset.settings)}else if(b.hasAttribute('data-close'))document.getElementById('dialog').close()});
function filter(){const q=(document.getElementById('dao-search')?.value||'').toLowerCase();let n=0;document.querySelectorAll('[data-dao]').forEach(d=>{const ok=d.dataset.name.toLowerCase().includes(q)&&(state.category==='All DAOs'||d.dataset.category===state.category);d.hidden=!ok;if(ok)n++});document.getElementById('no-results').hidden=n!==0}
document.addEventListener('input',e=>{if(e.target.id==='dao-search')filter()});document.getElementById('jump').addEventListener('change',e=>navigate(e.target.value));window.mockup={screens:Object.keys(screens),concepts:Object.keys(concepts),navigate,state,setConcept(c){if(concepts[c]){state.concept=c;render()}}};render();
})();
</script></body></html>

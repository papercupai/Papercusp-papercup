const icon=n=>'<svg viewBox="0 0 24 24" aria-hidden="true">'+(icons[n]||icons.plans)+'</svg>';
document.querySelectorAll('[data-icon]').forEach(el=>el.insertAdjacentHTML('afterbegin',icon(el.dataset.icon)));document.querySelector('#examplelabel').innerHTML=icon('clock')+' Example activity';
const people={mira:{name:'Mira',initial:'MI',tone:'',role:'Lead',state:'Working',task:'Final acceptance checks'},theo:{name:'Theo',initial:'TH',tone:'t1',role:'Agent',state:'Working',task:'Inbox filters'},uma:{name:'Uma',initial:'UM',tone:'t2',role:'Agent',state:'Working',task:'Notification grouping'},luca:{name:'Luca',initial:'LU',tone:'t3',role:'Lead',state:'Waiting',task:'Needs your decision'},iris:{name:'Iris',initial:'IR',tone:'t4',role:'Lead',state:'Working',task:'Testing the welcome flow'},eli:{name:'Eli',initial:'EL',tone:'t2',role:'Agent',state:'Ended',task:'Session finished'}};
const plans=[{id:'inbox',title:'Unified inbox',area:'Workspace',state:'active',done:18,total:24,agents:['mira','theo','uma'],latest:'Checking the final flow',age:'Just now',desc:'One place for decisions, messages and updates that need your attention.'},{id:'releases',title:'Reliable releases',area:'Platform',state:'active',done:9,total:16,agents:['luca'],latest:'Needs your decision',age:'4m ago',attention:'Decision needed',desc:'Make releases predictable and keep recovery simple when something goes wrong.'},{id:'onboarding',title:'Agent onboarding',area:'Agents',state:'active',done:6,total:10,agents:['iris'],latest:'Testing the welcome flow',age:'2m ago',desc:'Help every new agent find its work and start with the right context.'},{id:'search',title:'Workspace search',area:'Workspace',state:'active',done:2,total:8,agents:[],latest:'No agent assigned',age:'Last activity 2h ago',attention:'No agent working',desc:'Find plans, files and conversations in one search.'},{id:'calendar',title:'Calendar & scheduling',area:'Apps',state:'ready',done:0,total:12,agents:[],latest:'Ready when you are',age:'Updated yesterday',desc:'Make time for the work that matters.'},{id:'roles',title:'Shared workspace roles',area:'Workspace',state:'ready',done:0,total:9,agents:[],latest:'Ready when you are',age:'Updated yesterday',desc:'Simple permissions for shared work.'},{id:'customer',title:'Customer workspace',area:'Apps',state:'draft',done:0,total:0,agents:[],latest:'Still taking shape',age:'Updated 2d ago',desc:'A new home for customer work.'},{id:'conversations',title:'Faster conversations',area:'Experience',state:'done',done:14,total:14,agents:['eli'],latest:'Completed',age:'Finished yesterday',desc:'Keep every conversation responsive.'}];
const escape=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let concept=new URLSearchParams(location.search).get('view')||'conversation',filter='all',query='',selected='inbox',selectedAgent='mira',returnFocus=null;const draftReplies={};
const stateLabel=s=>({active:'Active',ready:'Ready',draft:'Draft',done:'Done'}[s]);
function av(id,live=true){const p=people[id];return '<span class="avatar '+p.tone+'">'+p.initial+(live?'<i class="dot '+(p.state==='Waiting'?'waiting':p.state==='Ended'?'off':'')+'"></i>':'')+'</span>'}
function badge(p){return '<span class="badge '+p.state+'"><i class="dot '+(p.state==='ready'?'off':p.state==='draft'?'draft':'')+'"></i>'+stateLabel(p.state)+'</span>'}
function agentButton(id,pid){const p=people[id];return '<button class="agentpill" data-chat="'+id+'" data-plan="'+pid+'" aria-label="Open conversation with '+p.name+'">'+av(id)+'<span><span class="agentline"><span class="agentname">'+p.name+'</span>'+icon('chat')+'</span><span class="agentstatus '+(p.state==='Waiting'?'waiting':'')+'">'+p.state+(p.role==='Lead'?' · Lead':'')+'</span></span></button>'}
function moreAgents(p){return p.agents.length>1?'<div class="moreagents">'+p.agents.slice(1).map(id=>'<button data-chat="'+id+'" data-plan="'+p.id+'" aria-label="Open conversation with '+people[id].name+'">'+av(id,false)+'<span>'+people[id].name+'</span></button>').join('')+'</div>':''}
function progress(p){return '<span class="progresstext">'+(p.total?p.done+' <span>/ '+p.total+' items</span>':'Not scoped yet')+'</span>'+(p.total?'<div class="progress" aria-label="'+p.done+' of '+p.total+' items complete"><i style="width:'+p.done/p.total*100+'%"></i></div>':'')}
function visiblePlans(){return plans.filter(p=>(filter==='all'||filter==='attention'&&p.attention||p.state===filter)&&(!query||[p.title,p.area,...p.agents.map(id=>people[id].name)].join(' ').toLowerCase().includes(query.toLowerCase())))}
function header(){const active=plans.filter(p=>p.state==='active'),currentAgents=active.flatMap(p=>p.agents),needs=active.filter(p=>p.attention);return '<div class="heading"><div><div class="eyebrow">YOUR WORK, IN ONE PLACE</div><h1>Plans'+(concept==='conversation'?'<span class="recommend">SELECTED DESIGN</span>':'')+'</h1><p class="subhead">See what’s moving, who’s working, and where you’re needed.</p></div><button class="button" data-demo="This is a design preview. Creating a plan will use the existing plan editor.">'+icon('plus')+' New plan</button></div>'+(concept==='conversation'?'':'<div class="stats"><button data-filter="all"><b>'+plans.length+'</b> plans</button><button data-filter="active"><i class="dot"></i><b>'+active.length+'</b> active</button><span>'+icon('agents')+' <b>'+currentAgents.length+'</b> agents · '+currentAgents.filter(id=>people[id].state==='Working').length+' working, '+currentAgents.filter(id=>people[id].state==='Waiting').length+' waiting</span><button class="attention" data-filter="attention">'+icon('alert')+'<b>'+needs.length+'</b> need attention '+icon('arrow')+'</button></div>')}
function filters(){return '<div class="filters"><div class="filtertabs" aria-label="Filter plan status">'+['all','active','ready','draft','done'].map(s=>'<button data-filter="'+s+'" class="'+(filter===s?'selected':'')+'" aria-pressed="'+(filter===s)+'">'+(s==='all'?'All plans':stateLabel(s))+'<small>'+plans.filter(p=>s==='all'||p.state===s).length+'</small></button>').join('')+'</div><label class="search">'+icon('search')+'<span class="sr">Search plans or agents</span><input id="search" value="'+escape(query)+'" placeholder="Search plans or agents…"></label></div>'}
function overview(){const rows=visiblePlans();return header()+filters()+'<div class="tablewrap"><table class="plan-table"><thead><tr><th>Plan</th><th>Status</th><th>Progress</th><th>Agents · click to talk</th><th>Latest activity</th></tr></thead><tbody>'+rows.map(p=>'<tr><td><button class="plantitle" data-select="'+p.id+'">'+p.title+'</button><div class="planmeta">'+p.area+'</div></td><td>'+badge(p)+'</td><td>'+progress(p)+'</td><td>'+(p.agents.length?'<div class="agents">'+agentButton(p.agents[0],p.id)+moreAgents(p)+'</div>':p.state==='active'?'<span class="noagent">'+icon('alert')+' No agent working</span>':'<span class="quiet">No agents assigned</span>')+'</td><td class="latest">'+(p.attention?'<div class="needs">'+icon('alert')+p.attention+'</div>':'')+(!p.attention?p.latest+'<br>':'')+p.age+'</td></tr>').join('')+'</tbody></table>'+(rows.length?'':'<div class="empty">No matching plans. Try another search or clear your filters.</div>')+'</div><div class="tablefoot"><span>Showing '+rows.length+' of '+plans.length+' plans · all statuses included</span><span>'+icon('chat')+' Click any agent to open their conversation</span></div><p class="legend"><strong>Active</strong> = work on it now &nbsp; · &nbsp; <strong>Ready</strong> = approved for later &nbsp; · &nbsp; <strong>Draft</strong> = still taking shape</p>'}
function boardCard(p){return '<article class="boardcard '+(p.attention?'flagged':'')+'"><button class="plantitle" data-select="'+p.id+'">'+p.title+'</button><div class="planmeta">'+p.area+' · '+p.age+'</div>'+(p.total?'<div class="boardprogress"><div class="progress"><i style="width:'+p.done/p.total*100+'%"></i></div><span>'+p.done+' / '+p.total+'</span></div>':'<p class="quiet" style="margin:13px 0">Not scoped yet</p>')+(p.attention?'<div class="callout">'+icon('alert')+p.attention+'</div>':'')+'<div class="cardfooter">'+(p.agents.length?'<div class="agents">'+agentButton(p.agents[0],p.id)+moreAgents(p)+'</div><button class="button" data-chat="'+p.agents[0]+'" data-plan="'+p.id+'" aria-label="Open '+people[p.agents[0]].name+' conversation">'+icon('chat')+' Talk</button>':p.state==='active'?'<span class="noagent">No agent working</span><button class="button" data-demo="Assign an agent to Workspace search. The production action would open the existing agent picker.">Assign '+icon('plus')+'</button>':'<span class="quiet">'+(p.state==='draft'?'Still taking shape':'Ready for later')+'</span>')+'</div></article>'}
function board(){const list=visiblePlans();return header()+filters()+'<div class="board">'+['active','ready','draft','done'].map(s=>{const ps=list.filter(p=>p.state===s);return '<section><div class="columnhead"><span><i class="dot '+(s==='ready'?'off':s==='draft'?'draft':'')+'"></i>'+stateLabel(s)+' <em>'+ps.length+'</em></span>'+icon('down')+'</div>'+ps.map(boardCard).join('')+(!ps.length?'<div class="emptycolumn">No '+s+' plans in this view.</div>':'')+'</section>'}).join('')+'</div><p class="legend">Plan status sets the column. Agent activity stays visible on the card.</p>'}
function chatMarkup(pid,id,drawer=false){const p=plans.find(p=>p.id===pid),a=people[id];let msgs;if(pid==='inbox'){msgs=[['owner','Which part are you working on now?','10:38'],['agent',id==='mira'?'I’m checking the full inbox flow. Theo is finishing filters and Uma is testing notification grouping.':'I’m working on '+a.task.toLowerCase()+'. Mira is coordinating the full inbox flow.','10:39'],['owner','Make sure I can see anything that needs a decision without digging.','10:40'],['agent','That’s included. Decisions stay at the top, and every update links back to its plan. I’ll send you a preview when this check is complete.','10:41']]}else{msgs=[['owner','Where are we with this plan?','10:38'],['agent',a.state==='Waiting'?'I’ve finished the checks I can run. I need your decision on the release recovery approach before continuing.':a.state==='Ended'?'This plan is complete. You can read the conversation here and resume the agent if you need more work.':'I’m working on '+a.task.toLowerCase()+'. The plan is moving forward.','10:39']]};return '<section class="chat"><div class="chathead">'+av(id)+'<div><div class="agentname">'+a.name+' <span class="role">'+a.role+'</span></div><div class="agentstatus '+(a.state==='Waiting'?'waiting':'')+'">'+a.state+' · '+p.title+'</div></div><div class="tools">'+(drawer?'<button class="closechat" data-close aria-label="Close conversation">'+icon('close')+'</button>':'<button data-chat="'+id+'" data-plan="'+pid+'" data-detach aria-label="Expand conversation">'+icon('external')+'</button>')+'</div></div><div class="chatcontext">'+icon('plans')+' Existing conversation · '+p.title+'</div><div class="messages"><div class="day">Today · example conversation</div>'+msgs.map(([who,body,time])=>'<div class="message '+(who==='owner'?'owner':'')+'"><div class="msgby">'+(who==='agent'?av(id,false):'')+(who==='owner'?'You':a.name)+'<time>'+time+'</time></div><div class="msgbody">'+body+(who==='agent'&&time==='10:41'?'<div class="miniupdate">'+icon('check')+' 18 of 24 plan items complete</div>':'')+'</div></div>').join('')+(draftReplies[id]||[]).map(msg=>'<div class="message owner"><div class="msgby">You <time>Preview</time></div><div class="msgbody">'+escape(msg)+'</div></div>').join('')+'</div><form class="chatcompose" data-compose="'+id+'"><label class="sr" for="reply-'+id+(drawer?'-drawer':'')+'">Message '+a.name+'</label><textarea id="reply-'+id+(drawer?'-drawer':'')+'" placeholder="Message '+a.name+' about '+p.title.toLowerCase()+'…"></textarea><div class="composefoot"><span>Only '+a.name+' receives this</span><button class="button primary" type="submit">Preview reply '+icon('up')+'</button></div></form><p class="chatnote">Mockup only · replies stay in this preview</p></section>'}
function conversation(){
  const rows=visiblePlans();
  const p=rows.find(pl=>pl.id===selected)||rows[0];
  if(p){selected=p.id;if(!p.agents.includes(selectedAgent))selectedAgent=p.agents[0]||null;}
  const listTitle=query?'Matching plans':filter==='all'?'All plans':stateLabel(filter)+' plans';
  const list='<section class="planlist"><div class="listhead">'+listTitle+' <span>'+rows.length+' of '+plans.length+'</span></div>'+rows.map(pl=>'<button class="minirow '+(selected===pl.id?'selected':'')+'" data-inline-plan="'+pl.id+'"><span class="minititle">'+pl.title+'</span><span class="minimeta"><i class="dot '+(pl.state==='ready'?'off':pl.state==='draft'?'draft':'')+'"></i>'+stateLabel(pl.state)+'<em>'+(pl.agents.length?pl.agents.length+' '+(pl.agents.length===1?'agent':'agents'):pl.state==='active'?'No agent working':'No agents')+'</em></span></button>').join('')+'</section>';
  if(!p)return header()+filters()+'<div class="split">'+list+'<div class="empty" style="grid-column:2 / -1;margin:auto"><h2 style="font-size:17px;margin-bottom:8px">No matching plans</h2><p>Try another search or choose a different status.</p></div></div>';
  return header()+filters()+'<div class="split">'+list+'<section class="plandetail">'+badge(p)+'<h2>'+p.title+'</h2><p class="description">'+p.desc+'</p><div class="detailprogress"><span class="progresstext"><span>Plan progress</span><strong>'+p.done+' / '+p.total+' items</strong></span><div class="progress"><i style="width:'+(p.total?p.done/p.total*100:0)+'%"></i></div></div><div class="sectionlabel"><strong>Agents on this plan</strong><span>'+p.agents.length+'</span></div>'+p.agents.map(id=>'<div class="detailagent '+(id===selectedAgent?'selected':'')+'">'+av(id)+'<div><div class="agentname">'+people[id].name+(people[id].role==='Lead'?'<span class="role">Lead</span>':'')+'</div><div class="agentstatus '+(people[id].state==='Waiting'?'waiting':'')+'">'+people[id].task+'</div></div><button data-inline-agent="'+id+'" aria-label="Open conversation with '+people[id].name+'">'+icon('chat')+'</button></div>').join('')+(!p.agents.length?'<p class="quiet">'+(p.state==='active'?'This plan is active, but nobody is working on it. Assign an agent to begin.':'No agent assigned yet.')+'</p>':'')+(p.id==='inbox'?'<div class="sectionlabel"><strong>Happening now</strong></div><div class="taskline">'+icon('check')+' Decision queue complete</div><div class="taskline">'+icon('clock')+' Final acceptance checks</div>':'')+'<button class="button link" style="margin-top:22px" data-demo="The full plan would open in the existing plan dashboard.">View full plan '+icon('arrow')+'</button></section>'+(selectedAgent?chatMarkup(p.id,selectedAgent):'<section class="chat"><div class="empty" style="margin:auto"><h3 style="font-size:15px;margin-bottom:8px">No agent conversation yet</h3><p style="font-size:11px;margin-bottom:16px">Assign an agent to start work on this plan.</p><button class="button" data-demo="The production action would open the existing agent picker.">'+icon('plus')+' Assign an agent</button></div></section>')+'</div><div class="tablefoot"><span>Showing '+rows.length+' of '+plans.length+' plans · keep your plans in view while you talk.</span><span>'+icon('chat')+' Select an agent to switch conversations</span></div>';
}
function render(){if(!['overview','board','conversation'].includes(concept))concept='conversation';document.querySelectorAll('[data-concept]').forEach(b=>{b.classList.toggle('selected',b.dataset.concept===concept);b.setAttribute('aria-pressed',String(b.dataset.concept===concept))});document.querySelector('#caption').innerHTML={overview:'<strong>A / Overview.</strong> Every plan, its status, named agents, and direct conversation access.',board:'<strong>B / Status board.</strong> Group plans by commitment. See work in motion and unattended active plans at a glance.',conversation:'<strong>Selected: C + A’s filters.</strong> Filter all plans by status, then keep the plan, team, and agent conversation open together.'}[concept];document.querySelector('#content').innerHTML=concept==='overview'?overview():concept==='board'?board():conversation();const s=document.querySelector('#search');if(s)s.addEventListener('input',()=>{const start=s.selectionStart;query=s.value;render();const n=document.querySelector('#search');n.focus();n.setSelectionRange(start,start)})}
function openChat(pid,id){returnFocus=document.activeElement;const d=document.querySelector('#drawer');d.querySelector('.drawer').innerHTML=chatMarkup(pid,id,true);d.hidden=false;d.querySelector('[data-close]').focus()}
function closeChat(){document.querySelector('#drawer').hidden=true;if(returnFocus&&document.contains(returnFocus))returnFocus.focus()}
let toastTimer;function toast(text){const t=document.querySelector('.toast');t.textContent=text;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,4200)}
document.addEventListener('click',e=>{const b=e.target.closest('button');if(!b){if(e.target.id==='drawer')closeChat();return}if(b.dataset.concept){concept=b.dataset.concept;filter='all';query='';history.replaceState({},'',location.pathname+'?view='+concept);render()}else if(b.dataset.filter){filter=b.dataset.filter;render()}else if(b.dataset.chat){openChat(b.dataset.plan,b.dataset.chat)}else if(b.dataset.select){selected=b.dataset.select;concept='conversation';history.replaceState({},'',location.pathname+'?view=conversation');render()}else if(b.dataset.inlinePlan){selected=b.dataset.inlinePlan;render()}else if(b.dataset.inlineAgent){selectedAgent=b.dataset.inlineAgent;render()}else if(b.hasAttribute('data-close'))closeChat();else if(b.dataset.demo)toast(b.dataset.demo)});
document.addEventListener('submit',e=>{if(!e.target.matches('[data-compose]'))return;e.preventDefault();const input=e.target.querySelector('textarea'),msg=input.value.trim(),id=e.target.dataset.compose;if(!msg)return;(draftReplies[id]??=[]).push(msg);const isDrawer=!document.querySelector('#drawer').hidden,pid=isDrawer?plans.find(p=>p.agents.includes(id)).id:selected;if(isDrawer){document.querySelector('#drawer .drawer').innerHTML=chatMarkup(pid,id,true);document.querySelector('#drawer textarea').focus()}else{render();document.querySelector('.chat textarea').focus()}toast('Preview reply added locally. No message was sent.')});
document.addEventListener('keydown',e=>{const d=document.querySelector('#drawer');if(e.key==='Escape'&&!d.hidden){closeChat();return}if(e.key==='Tab'&&!d.hidden){const fs=[...d.querySelectorAll('button,textarea')],first=fs[0],last=fs.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});
render();
</script>
</body>

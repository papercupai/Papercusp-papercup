document.addEventListener('click',event=>{const b=event.target.closest('button,[role="button"][data-surface]');if(!b)return;let repaint=true;if(b.dataset.direction){direction=b.dataset.direction;state.detail=false}else if(b.dataset.surface){surface=b.dataset.surface;state.detail=false}else if(b.dataset.filter)state.filter=b.dataset.filter;else if(b.dataset.agent){state.selected=b.dataset.agent;if(direction==='a'){const a=agents.find(a=>a.id===state.selected);toast('Preview: '+(a.local?'focus '+a.name+'’s terminal':'connect using '+a.profile+' and focus '+a.name+'’s terminal'))}}else if(b.dataset.peer){state.selected=b.dataset.peer;toast('Preview: focus '+agents.find(a=>a.id===state.selected).name+'’s terminal')}else if(b.dataset.layout){state.layout=b.dataset.layout}else if(b.dataset.routing){state.routing=b.dataset.routing;toast('Preview: '+state.routing+' routing selected')}else if(b.dataset.accountDefault){state.defaultAccount=state.defaultAccount===b.dataset.accountDefault?'':b.dataset.accountDefault}else if(b.dataset.accountForce){const id=b.dataset.accountForce;state.forced.has(id)?state.forced.delete(id):state.forced.add(id)}else if(b.dataset.accountExclude){const id=b.dataset.accountExclude;state.excluded.has(id)?state.excluded.delete(id):state.excluded.add(id)}else if(b.dataset.action){const action=b.dataset.action;if(action==='plan-detail')state.detail='plan';else if(action==='report-detail')state.detail='report';else if(action==='fleet-drawer')state.detail='fleet';else if(action==='close-detail')state.detail=false;else if(action==='toggle-orders')state.showOrders=!state.showOrders;else if(action==='toggle-activity')state.showActivity=!state.showActivity;else if(action==='collapse'){state.showOrders=false;state.showActivity=false}else if(action==='open-chat'){surface='chat';state.detail=false}else if(action==='clear-overrides'){state.forced.clear();state.excluded.clear();toast('Preview: Force / Exclude overrides cleared')}else if(action==='focus-agent'){const a=agents.find(a=>a.id===state.selected);toast('Preview: '+(a.local?'focus the existing '+a.name+' terminal':'reuse psu saved connection '+a.profile+'; focus '+a.name+'’s terminal'))}else if(action==='focus-iris')toast('Preview: focus Iris’s existing terminal on Workspace 2');else if(action==='arrange')toast('Preview: arrange terminals and attached panels; keep an Undo snapshot');else if(action==='undo')toast('Preview: restore the previous window arrangement');else if(action==='scope-remote')toast('Preview: select a desktop through the existing psu connection');else if(action==='scope-local')toast('Preview: arrange windows on this computer');else if(action==='account-settings')toast('Preview: open the existing account settings');else if(action==='voice')toast('Preview: start Papercup voice');else if(action==='attach')toast('Preview: choose a file');else toast('Preview: '+action.replaceAll('-',' '))}else repaint=false;if(repaint)render()});
document.addEventListener('input',e=>{if(e.target.id==='agent-search'){const pos=e.target.selectionStart;state.query=e.target.value;render();const input=document.getElementById('agent-search');input.focus();input.setSelectionRange(pos,pos)}});
document.addEventListener('keydown',e=>{if(e.target.id!=='agent-search')return;const ids=[...document.querySelectorAll('#stage [data-agent]')].map(row=>row.dataset.agent);if(['ArrowDown','ArrowUp'].includes(e.key)&&ids.length){e.preventDefault();const at=ids.indexOf(state.selected);state.selected=ids[(Math.max(at,0)+(e.key==='ArrowDown'?1:-1)+ids.length)%ids.length];render();document.getElementById('agent-search')?.focus()}else if(e.key==='Enter'&&ids.length){e.preventDefault();const a=agents.find(a=>a.id===(ids.includes(state.selected)?state.selected:ids[0]));toast('Preview: '+(a.local?'focus '+a.name+'’s existing terminal':'reuse psu saved connection '+a.profile+' and focus '+a.name+'’s terminal'))}});
document.addEventListener('submit',e=>{if(e.target.id==='chat-form'){e.preventDefault();const v=document.getElementById('chat-input').value.trim();if(v){state.chatMessages.push(v);render();toast('Preview message only · nothing was sent')}}});
document.getElementById('platform').addEventListener('change',e=>{platform=e.target.value;render()});document.getElementById('overview').addEventListener('click',()=>{surface=surface==='overview'?'launcher':'overview';state.detail=false;render()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&state.detail){state.detail=false;render();return}if(e.target.matches('[role="button"][data-surface]')&&['Enter',' '].includes(e.key)){e.preventDefault();e.target.click();return}if(/INPUT|TEXTAREA|SELECT/.test(e.target.tagName))return;if(['1','2','3'].includes(e.key)){direction=['a','b','c'][+e.key-1];state.detail=false;render()}});
window.addEventListener('resize',fit);window.__mockup={set:(d,s,p='ubuntu')=>{direction=d;surface=s;platform=p;state.detail=false;state.osHidden=false;render()},get:()=>({direction,surface,platform,...state,forced:[...state.forced],excluded:[...state.excluded]}),surfaces:Object.keys(surfaces),directions:Object.keys(directions)};render();

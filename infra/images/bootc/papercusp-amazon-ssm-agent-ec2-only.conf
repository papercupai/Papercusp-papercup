# Installed as /usr/lib/systemd/system/amazon-ssm-agent.service.d/papercusp-ec2-only.conf
# (WI-10005605). One bootc image serves every cloud (P-307), so amazon-ssm-agent is
# baked into the GCE and Azure disks too. Off EC2 there is no instance identity for it
# to register with: it would retry forever (Restart=always, RestartSec=90) and keep a
# root daemon with OOMScoreAdjust=-900 resident for nothing. The condition makes systemd
# skip the unit on any non-EC2 firmware. The unit stays ENABLED, so the same image
# starts it on EC2 with no per-cloud step.
#
# Nitro instances report sys_vendor "Amazon EC2". Xen-generation instance types
# (t2/m4/c4) report "Xen" and are deliberately not covered: the AWS provider does not
# launch them, and widening this to a glob needs systemd >= 253 ($= comparisons), while
# CentOS Stream 9 ships 252.
[Unit]
ConditionFirmware=smbios-field(sys_vendor = "Amazon EC2")

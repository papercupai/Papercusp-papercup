# Installed as /usr/lib/tmpfiles.d/papercusp-amazon-ssm-agent.conf (WI-10005605).
# The amazon-ssm-agent RPM ships /var/lib/amazon/ssm as package content. On a bootc
# host /var is machine-local state seeded once, so the Containerfile removes that
# directory from the image (bootc container lint var-tmpfiles) and this entry creates
# it at boot instead. The agent runs as root and keeps its registration and
# instance-identity material here, so the directory is not world-readable.
d /var/lib/amazon 0755 root root -
d /var/lib/amazon/ssm 0750 root root -

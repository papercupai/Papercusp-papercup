# Installed as /usr/lib/systemd/system/google-guest-agent.service.d/papercusp-gce-only.conf
# (WI-10005618). One bootc image serves every cloud (P-307), so google-guest-agent is
# baked into the AWS and Azure disks too. Off GCE there is no metadata server for it to
# read (metadata.google.internal does not resolve), so it would keep a root daemon
# resident retrying for nothing. The condition makes systemd skip the unit on any
# non-GCE firmware. The unit stays ENABLED, so the same image starts it on GCE with no
# per-cloud step. Same pattern as papercusp-amazon-ssm-agent-ec2-only.conf.
#
# GCE reports sys_vendor "Google" on every machine family.
[Unit]
ConditionFirmware=smbios-field(sys_vendor = "Google")

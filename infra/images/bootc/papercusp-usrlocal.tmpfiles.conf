# Installed as /usr/lib/tmpfiles.d/papercusp-usrlocal.conf (WI-10005830).
# workspace-host.Containerfile links /usr/local to ../var/usrlocal, because on this
# base /usr/local is otherwise a real directory inside the read-only /usr and every
# runtime install the workspace-host bootstrap makes there (privileged conduits,
# native OMP, the ollama runtime, the customer agent toolchain) dies with EROFS.
# The base's rpm-ostree-0-integration-opt-usrlocal.conf creates /var/usrlocal itself;
# these are the subdirectories the bootstrap installs into and sudo's secure_path
# names. /var is machine-local state on a bootc host, so they are created at boot.
# /var/usrlocal itself is NOT repeated here: systemd-tmpfiles warns on a duplicate
# path across dropins, and the base's line already owns it.
d /var/usrlocal/bin 0755 root root -
d /var/usrlocal/sbin 0755 root root -
d /var/usrlocal/lib 0755 root root -
d /var/usrlocal/libexec 0755 root root -
d /var/usrlocal/share 0755 root root -
d /var/usrlocal/etc 0755 root root -
